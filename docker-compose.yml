name: courses

x-logging: &logging
  driver: json-file
  options: { max-size: '10m', max-file: '3' }
x-runtime: &runtime
  restart: unless-stopped
  init: true
  logging: *logging
  stop_grace_period: 40s

services:
  postgres:
    <<: *runtime
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-courses}
      POSTGRES_USER: ${POSTGRES_USER:-courses}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run make env}
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    <<: *runtime
    image: redis:7.4-bookworm
    # The password reaches redis-server through a file, never argv, where `ps`
    # and `docker top` would expose it to anything sharing the host.
    command: ['sh', '-c', 'umask 077 && printf "requirepass %s\nappendonly yes\n" "$$REDIS_PASSWORD" > /tmp/redis.conf && exec redis-server /tmp/redis.conf']
    environment: { REDIS_PASSWORD: '${REDIS_PASSWORD:?Run make env}' }
    volumes: [redis-data:/data]
    healthcheck:
      test: ['CMD-SHELL', 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 20
  mailpit:
    <<: *runtime
    image: axllent/mailpit:v1.31.2
    ports: ['127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025']
    healthcheck:
      test: ['CMD', 'wget', '--quiet', '--tries=1', '--spider', 'http://127.0.0.1:8025/api/v1/messages']
      interval: 5s
      timeout: 3s
      retries: 15
  migrate:
    build: { context: ./backend, dockerfile: Dockerfile, target: migrate }
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-courses}
      POSTGRES_USER: ${POSTGRES_USER:-courses}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run make env}
    depends_on: { postgres: { condition: service_healthy } }
    logging: *logging
    restart: 'no'
  api:
    <<: *runtime
    build: { context: ./backend, dockerfile: Dockerfile, target: api }
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-courses}
      POSTGRES_USER: ${POSTGRES_USER:-courses}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run make env}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Run make env}
      HTTP_ADDR: ':8080'
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      APP_ENV: ${APP_ENV:-development}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:8080}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      # Master key for 2FA at-rest protection (HKDF → AES-256-GCM for the TOTP secret, keyed HMAC for
      # recovery codes). The default is a non-secret dev value; production MUST override it with a real
      # base64 secret of >=32 random bytes (like COOKIE_SECURE, this dev default is not for prod).
      IDENTITY_2FA_SECRET_KEY: ${IDENTITY_2FA_SECRET_KEY:-ZGV2LW9ubHktMmZhLW1hc3Rlci1rZXktbm90LWEtc2VjcmV0}
      PLAYBACK_HEARTBEAT_SECONDS: ${PLAYBACK_HEARTBEAT_SECONDS:-30}
      PLAYBACK_OWNERSHIP_TTL_SECONDS: ${PLAYBACK_OWNERSHIP_TTL_SECONDS:-180}
      PLATFORM_SINGLE_INSTRUCTOR: ${PLATFORM_SINGLE_INSTRUCTOR:-true}
      SMTP_HOST: mailpit
      SMTP_PORT: '1025'
      MAIL_FROM: no-reply@courseforge.local
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      mailpit: { condition: service_healthy }
      # The API now writes uploaded image bytes to /media/i. K13: the media-data volume is populated
      # from the first container that mounts it, so the API starts after upload has populated the
      # tree — otherwise it would create /media/i into an empty volume and the workers' baked tree
      # would never copy in.
      upload: { condition: service_started }
    healthcheck:
      test: ['CMD', 'curl', '-fsS', '--max-time', '3', 'http://127.0.0.1:8080/readyz']
      interval: 5s
      timeout: 4s
      retries: 15
    read_only: true
    # /media holds uploaded image bytes (written 0640, dir 0750); nginx reads them read-only by its
    # courses-group membership. read_only root still applies — only this volume and /tmp are writable.
    volumes: [media-data:/media]
    tmpfs: [/tmp]
  media-worker:
    <<: *runtime
    build: { context: ./backend, dockerfile: Dockerfile, target: worker }
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-courses}
      POSTGRES_USER: ${POSTGRES_USER:-courses}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run make env}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Run make env}
      HTTP_ADDR: ':8081'
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      # K13: an EMPTY media-data volume is populated from the image's /media tree by whichever
      # container mounts it first; three images doing that in parallel collided on a fresh volume
      # ("mkdir …/_data/source: file exists", 2026-10-08, first `up` after a volume reset — the same
      # race a fresh clone can hit). upload goes first; the other writers start after it.
      upload: { condition: service_started }
    volumes: [media-data:/media]
    cpus: 2.0
    mem_limit: 2g
    pids_limit: 128
    healthcheck:
      test: ['CMD', 'curl', '-fsS', '--max-time', '3', 'http://127.0.0.1:8081/readyz']
      interval: 5s
      timeout: 4s
      retries: 15
    read_only: true
    tmpfs: [/tmp]
  asr-worker:
    <<: *runtime
    build: { context: ./backend, dockerfile: Dockerfile, target: asr-worker }
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-courses}
      POSTGRES_USER: ${POSTGRES_USER:-courses}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run make env}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Run make env}
      HTTP_ADDR: ':8083'
      WHISPER_MODEL_DIR: /opt/whisper/models/large-v3-turbo
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      # K13: see media-worker — upload populates a fresh media-data volume alone.
      upload: { condition: service_started }
    volumes: [media-data:/media]
    cpus: 6.0
    mem_limit: 5g
    pids_limit: 128
    healthcheck:
      test: ['CMD', 'curl', '-fsS', '--max-time', '3', 'http://127.0.0.1:8083/readyz']
      interval: 5s
      timeout: 4s
      retries: 15
    read_only: true
    tmpfs: [/tmp]
  upload:
    <<: *runtime
    build: { context: ./backend, dockerfile: Dockerfile, target: upload }
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-courses}
      POSTGRES_USER: ${POSTGRES_USER:-courses}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run make env}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Run make env}
      HTTP_ADDR: ':8082'
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    volumes: [media-data:/media]
    mem_limit: 512m
    pids_limit: 64
    healthcheck:
      test: ['CMD', 'curl', '-fsS', '--max-time', '3', 'http://127.0.0.1:8082/readyz']
      interval: 5s
      timeout: 4s
      retries: 15
    read_only: true
    tmpfs: [/tmp]
  frontend:
    <<: *runtime
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: production
      args: { APP_RELEASE: '${APP_RELEASE:-dev}' }
    # APP_RELEASE is passed both as a build arg (baked into the client bundle by
    # rsbuild define) and as runtime env (read by server.mjs), from one source,
    # so the client and SSR log lines carry one matching release.
    environment: { API_BASE_URL: 'http://api:8080', PORT: '3000', APP_RELEASE: '${APP_RELEASE:-dev}' }
    depends_on: { api: { condition: service_healthy } }
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 15
    read_only: true
    tmpfs: [/tmp]
  nginx:
    <<: *runtime
    image: nginxinc/nginx-unprivileged:1.30.4-alpine
    # Transcoder output is 0750/0640 owned by the `courses` group, so the worker keeps the
    # tree off the world while nginx still reads the bytes it is the only one allowed to serve.
    group_add: ['10001']
    ports: ['127.0.0.1:${HTTP_PORT:-8080}:8080']
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infrastructure/nginx/login-req.conf:/etc/nginx/login-req.conf:ro
      - ./infrastructure/nginx/api-req.conf:/etc/nginx/api-req.conf:ro
      - ./infrastructure/nginx/clientlog-req.conf:/etc/nginx/clientlog-req.conf:ro
      - media-data:/media:ro
    depends_on:
      api: { condition: service_healthy }
      frontend: { condition: service_healthy }
      media-worker: { condition: service_healthy }
      upload: { condition: service_healthy }
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:8080/healthz']
      interval: 5s
      timeout: 3s
      retries: 15
    read_only: true
    tmpfs: [/tmp, /var/cache/nginx]
  prometheus:
    <<: *runtime
    image: prom/prometheus:v3.11.3
    profiles: [monitoring]
    volumes:
      - ./infrastructure/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on: { api: { condition: service_healthy }, media-worker: { condition: service_healthy } }
  # Log aggregation, opt-in and docker-network-only like prometheus (no host
  # ports — AC6). promtail ships container stdout to loki; grafana reads both
  # prometheus and loki. Applications always log to stdout regardless, so loki
  # being down never affects logging.
  loki:
    <<: *runtime
    image: grafana/loki:3.4.1
    profiles: [monitoring]
    command: ['-config.file=/etc/loki/loki-config.yaml']
    volumes:
      - ./infrastructure/monitoring/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki-data:/loki
  promtail:
    <<: *runtime
    image: grafana/promtail:3.4.1
    profiles: [monitoring]
    command: ['-config.file=/etc/promtail/promtail-config.yaml']
    volumes:
      - ./infrastructure/monitoring/promtail-config.yaml:/etc/promtail/promtail-config.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - promtail-positions:/tmp
    depends_on: { loki: { condition: service_started } }
  grafana:
    <<: *runtime
    image: grafana/grafana:11.5.2
    profiles: [monitoring]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_DEFAULT_THEME: light
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_ANALYTICS_CHECK_FOR_UPDATES: 'false'
    volumes:
      - ./infrastructure/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infrastructure/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      loki: { condition: service_started }
      prometheus: { condition: service_started }

volumes:
  postgres-data:
  redis-data:
  media-data:
  prometheus-data:
  loki-data:
  grafana-data:
  promtail-positions:
