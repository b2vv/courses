name: courses

x-logging: &logging
  driver: json-file
  options: { max-size: '10m', max-file: '3' }
x-runtime: &runtime
  restart: unless-stopped
  init: true
  logging: *logging
  stop_grace_period: 40s

services:
  postgres:
    <<: *runtime
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-courses}
      POSTGRES_USER: ${POSTGRES_USER:-courses}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run make env}
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    <<: *runtime
    image: redis:7.4-bookworm
    # The password reaches redis-server through a file, never argv, where `ps`
    # and `docker top` would expose it to anything sharing the host.
    command: ['sh', '-c', 'umask 077 && printf "requirepass %s\nappendonly yes\n" "$$REDIS_PASSWORD" > /tmp/redis.conf && exec redis-server /tmp/redis.conf']
    environment: { REDIS_PASSWORD: '${REDIS_PASSWORD:?Run make env}' }
    volumes: [redis-data:/data]
    healthcheck:
      test: ['CMD-SHELL', 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 20
  migrate:
    build: { context: ./backend, dockerfile: Dockerfile, target: migrate }
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-courses}
      POSTGRES_USER: ${POSTGRES_USER:-courses}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run make env}
    depends_on: { postgres: { condition: service_healthy } }
    logging: *logging
    restart: 'no'
  api:
    <<: *runtime
    build: { context: ./backend, dockerfile: Dockerfile, target: api }
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-courses}
      POSTGRES_USER: ${POSTGRES_USER:-courses}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run make env}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Run make env}
      HTTP_ADDR: ':8080'
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      APP_ENV: ${APP_ENV:-development}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:8080}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    healthcheck:
      test: ['CMD', 'curl', '-fsS', '--max-time', '3', 'http://127.0.0.1:8080/readyz']
      interval: 5s
      timeout: 4s
      retries: 15
    read_only: true
    tmpfs: [/tmp]
  media-worker:
    <<: *runtime
    build: { context: ./backend, dockerfile: Dockerfile, target: worker }
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-courses}
      POSTGRES_USER: ${POSTGRES_USER:-courses}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run make env}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Run make env}
      HTTP_ADDR: ':8081'
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    volumes: [media-data:/media]
    cpus: 2.0
    mem_limit: 2g
    pids_limit: 128
    healthcheck:
      test: ['CMD', 'curl', '-fsS', '--max-time', '3', 'http://127.0.0.1:8081/readyz']
      interval: 5s
      timeout: 4s
      retries: 15
    read_only: true
    tmpfs: [/tmp]
  frontend:
    <<: *runtime
    build: { context: ., dockerfile: frontend/Dockerfile, target: production }
    environment: { API_BASE_URL: 'http://api:8080', PORT: '3000' }
    depends_on: { api: { condition: service_healthy } }
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 15
    read_only: true
    tmpfs: [/tmp]
  nginx:
    <<: *runtime
    image: nginxinc/nginx-unprivileged:1.30.4-alpine
    ports: ['127.0.0.1:${HTTP_PORT:-8080}:8080']
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - media-data:/media:ro
    depends_on:
      api: { condition: service_healthy }
      frontend: { condition: service_healthy }
      media-worker: { condition: service_healthy }
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:8080/healthz']
      interval: 5s
      timeout: 3s
      retries: 15
    read_only: true
    tmpfs: [/tmp, /var/cache/nginx]
  prometheus:
    <<: *runtime
    image: prom/prometheus:v3.11.3
    profiles: [monitoring]
    volumes:
      - ./infrastructure/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on: { api: { condition: service_healthy }, media-worker: { condition: service_healthy } }

volumes:
  postgres-data:
  redis-data:
  media-data:
  prometheus-data:
