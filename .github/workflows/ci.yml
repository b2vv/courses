name: foundation
# K12 (owner's decision 2026-10-07): the light gate runs on every PR commit and on main; the browser
# suite runs on major/minor version tags and on demand. A green full run measured 40m16 on the 2 vCPU
# runner (K10, run 37677792282) and this private repository has 2000 Actions minutes a month, while
# PRs merge often. The local ordered `make check` stays the authoritative phase gate (AGENTS.md).
# This closes "e2e on every PR commit": hardware-timing regressions now surface at tag boundaries or
# on a manual run — check with `gh run list --workflow=ci.yml`: the e2e job appears only there.
on:
  push:
    branches: [main]
    tags: ['v[0-9]+.[0-9]+.0']
    paths-ignore: ['work/**', 'docs/**', '**/*.md']
  pull_request:
    paths-ignore: ['work/**', 'docs/**', '**/*.md']
  workflow_dispatch:
permissions: { contents: read }
# A new commit on a PR cancels that PR's superseded run, and only that one: the group is keyed per PR
# (per ref elsewhere), and main/tag runs are never cancelled.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  # K10: one compose project for every step. Absolute paths on purpose — a relative COMPOSE_FILE
  # resolves against each caller's cwd and disables parent-directory discovery (it broke every spec
  # that shells compose from frontend/). Base + e2e overlay + the CI override (no asr-worker,
  # media-worker capped): `make build` must not build the 2.94 GB asr-worker image either.
  COMPOSE_FILE: ${{ github.workspace }}/docker-compose.yml:${{ github.workspace }}/docker-compose.e2e.yml:${{ github.workspace }}/docker-compose.ci.yml
  # K12: the Go module and build caches as host directories (Makefile GO_RUN, integration.sh), so
  # actions/cache carries them between runs. K10 measured the uncached Go steps at ~13 of the
  # ~15 pre-browser minutes (unit 6.3, build 2.8, drift 1.9, integration 1.7).
  GO_MOD_CACHE: ${{ github.workspace }}/../go-cache/mod
  GO_BUILD_CACHE: ${{ github.workspace }}/../go-cache/build
jobs:
  verify:
    runs-on: ubuntu-latest
    # Back to 30 from the K10 bridge of 45: the browser suite no longer runs here.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: npm, cache-dependency-path: frontend/package-lock.json }
      - uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/../go-cache/mod
          key: go-mod-${{ hashFiles('backend/go.sum') }}
          restore-keys: go-mod-
      - uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/../go-cache/build
          key: go-build-${{ hashFiles('backend/go.sum', 'backend/**/*.go') }}
          restore-keys: go-build-
      - name: Install
        run: cd frontend && npm ci
      - name: Format
        run: make format-check
      - name: Lint
        run: make lint
      - name: Typecheck
        run: make typecheck
      - name: Unit tests
        run: make test
      - name: Integration tests
        run: make integration
      - name: Generated contract drift
        run: make check-generated
      - name: Production build
        run: make env build
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: integration-log
          retention-days: 7
          path: backend/test-results
  e2e:
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # K10 bridge: a green browser job measured ≈25 min of the 40m16 run (start + smoke + install +
    # 18m49 of tests); 45 keeps the margin the shared job never had.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: npm, cache-dependency-path: frontend/package-lock.json }
      - name: Install
        run: cd frontend && npm ci
      - name: Start
        run: make env up
      - name: Seed and smoke
        run: make seed-identities seed smoke
      - name: Install browser
        # K10: its own step with its own limit — run 37670569075 spent 29 min in `apt-get update`
        # inside `playwright install --with-deps` and hit the job limit with zero tests run. K12: the
        # first attempt is bounded at 240 s, so the retry also covers a hang, not only a fast failure
        # (a `||` retry never fires while the first attempt is still stuck).
        timeout-minutes: 10
        run: |
          cd frontend
          timeout 240 npx playwright install --with-deps chromium || (sleep 15 && npx playwright install --with-deps chromium)
      - name: Browser tests
        # K4: the api+nginx log of the WHOLE browser run is streamed from this same shell, so it is
        # on disk before recovery.spec recreates containers. The follower is stopped and the run's own
        # status is re-raised; `set +e` because the runner's shell is bash -e.
        # K12: `--reporter=list` — Playwright defaults to the dot reporter on CI, which printed no
        # per-test durations, so run 37677792282 could say "101 passed" but not how close playback
        # sat to its cadence limits. The list reporter puts every test's duration in the log.
        run: |
          set +e
          mkdir -p frontend/test-logs
          docker compose logs -f --no-color --timestamps api nginx > frontend/test-logs/api-nginx.log 2>&1 &
          follower=$!
          # E2E_SKIP_ASR: asr.spec needs the asr-worker the CI override does not start (K10).
          (cd frontend && E2E_SKIP_ASR=1 npm run e2e -- --reporter=list); status=$?
          kill $follower 2>/dev/null; wait $follower 2>/dev/null
          exit $status
      - uses: actions/upload-artifact@v4
        # K12: always, not only on failure — the api/nginx log and the per-test timings of a green
        # run are what show the margin; traces exist only for failures (retain-on-failure) anyway.
        if: always()
        with:
          name: playwright-traces
          retention-days: 7
          # K4/K5: the streamed api+nginx log travels with the traces, so a flake's message survives.
          path: |
            frontend/test-results
            frontend/test-logs
      - name: Shutdown
        if: always()
        run: docker compose down
