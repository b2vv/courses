services:
  api:
    environment:
      WAYFORPAY_MERCHANT_ACCOUNT: e2e_test_merchant
      WAYFORPAY_SECRET_KEY: e2e-wayforpay-secret
      WAYFORPAY_MERCHANT_DOMAIN: localhost
      PUBLIC_BASE_URL: http://localhost:8080
      WAYFORPAY_PAY_URL: http://localhost:8090/pay
      WAYFORPAY_STATUS_URL: http://wayforpay-stub:8080/api
      SMTP_HOST: mailpit
      SMTP_PORT: '1025'
      MAIL_FROM: no-reply@courseforge.local
    depends_on:
      wayforpay-stub: { condition: service_healthy }
      mailpit: { condition: service_healthy }
  mailpit: {}
  frontend:
    build:
      args:
        PUBLIC_WAYFORPAY_PAY_HOST: localhost
  nginx:
    # Larger login burst for the auth-heavy accounts e2e; overrides the strict production
    # login-req.conf at the same path (last mount wins). Production nginx.conf is untouched.
    volumes:
      - ./infrastructure/nginx/login-req.e2e.conf:/etc/nginx/login-req.conf:ro
  wayforpay-stub:
    restart: unless-stopped
    build:
      context: .
      dockerfile: frontend/e2e/wayforpay-stub/Dockerfile
    environment:
      WAYFORPAY_MERCHANT_ACCOUNT: e2e_test_merchant
      WAYFORPAY_SECRET_KEY: e2e-wayforpay-secret
    ports: ['127.0.0.1:8090:8080']
    healthcheck:
      test: ['CMD', 'curl', '-fsS', '--max-time', '3', 'http://127.0.0.1:8080/healthz']
      interval: 5s
      timeout: 3s
      retries: 15
