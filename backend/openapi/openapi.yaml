            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/PlaybackHeartbeatRequest'
                required: true
            responses:
                "204":
                    description: Ownership was renewed and the progress update was processed.
                    headers:
                        Cache-Control:
                            $ref: '#/components/headers/NoStore'
                        X-Request-ID:
                            $ref: '#/components/headers/RequestID'
                "400":
