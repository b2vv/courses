openapi: 3.0.3
info:
  title: Courses API
  version: 1.0.0
  description: Public catalog, session authentication, protected administration, learning purchases and playback-session control.
servers:
  - url: /
paths:
  /api/v1/courses:
    get:
      operationId: listPublishedCourses
      summary: List published courses
      description: >-
        Only published courses are visible. Search is a case-insensitive literal substring
        of title or summary; percent and underscore are literal characters.
        Query parameters must occur at most once; unknown parameters are rejected.
        Limit and offset accept decimal digits only. Search is trimmed before validating
        a maximum of 100 Unicode code points; NUL is rejected. List and total share one database snapshot.
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, maximum: 10000, default: 0 }
        - name: q
          in: query
          description: Search text, maximum 100 Unicode code points after trimming whitespace.
          schema: { type: string, default: '' }
        - name: sort
          in: query
          description: Recent orders by publishedAt descending then ID ascending; title uses PostgreSQL C collation then ID ascending.
          schema: { type: string, enum: [recent, title], default: recent }
      responses:
        '200':
          description: Published courses and pagination, including an empty items array when beyond the final page.
          headers:
            X-Request-ID: { $ref: '#/components/headers/RequestID' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CoursePage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/v1/courses/{slug}:
    get:
      operationId: getPublishedCourse
      summary: Get a published course
      description: >-
        Draft, archived and unknown courses all return the same 404 response. The program
        contains ordered module titles and ordered lesson titles only; it exposes no ids,
        positions, lesson descriptions or ownership. Query parameters are not supported.
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 120
            pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
      responses:
        '200':
          description: Published course with its ordered title-only program.
          headers:
            X-Request-ID: { $ref: '#/components/headers/RequestID' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CourseDetail' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/v1/learn/courses/{courseId}/purchase:
    post:
      operationId: startCoursePurchase
      summary: Start an idempotent course purchase
      description: Authenticated same-origin mutation. The order snapshots the published course price.
      parameters:
        - name: courseId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      responses:
        '201':
          description: The new or replayed pending order.
          headers:
            X-Request-ID: { $ref: '#/components/headers/RequestID' }
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PurchaseOrder' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/PurchaseConflict' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/v1/learn/orders/{orderId}:
    get:
      operationId: getPurchaseStatus
      summary: Read the authenticated account's purchase status
      parameters:
        - name: orderId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Current order status.
          headers:
            X-Request-ID: { $ref: '#/components/headers/RequestID' }
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PurchaseOrder' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/OrderNotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/v1/learn/orders/{orderId}/checkout:
    post:
      operationId: createPurchaseCheckout
      summary: Create the hosted WayForPay checkout form for the authenticated order owner
      parameters:
        - name: orderId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CheckoutRequest' }
      responses:
        '200':
          description: Ordered fields to POST to the hosted payment page.
          headers:
            X-Request-ID: { $ref: '#/components/headers/RequestID' }
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CheckoutForm' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '409': { $ref: '#/components/responses/PurchaseConflict' }
        '404': { $ref: '#/components/responses/OrderNotFound' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/v1/payments/wayforpay/callback:
    post:
      operationId: receiveWayForPayCallback
      summary: Receive a signed WayForPay service callback
      requestBody:
        required: true
        content:
          application/json: { schema: { type: object, additionalProperties: true } }
      responses:
        '200':
          description: Signed acknowledgement, including duplicate and ignored statuses.
          content:
            application/json: { schema: { $ref: '#/components/schemas/WayForPayAcknowledgement' } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/v1/admin/courses/{courseId}/grants:
    post:
      operationId: grantCourseAccess
      summary: Grant course access as an administrator
      description: Admin-only same-origin mutation. Creates an active admin grant and its audit record.
      parameters:
        - name: courseId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminGrantRequest' }
      responses:
        '201':
          description: Active administrative grant.
          headers:
            X-Request-ID: { $ref: '#/components/headers/RequestID' }
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CourseGrant' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/GrantForbidden' }
        '409': { $ref: '#/components/responses/PurchaseConflict' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/v1/admin/users:
    get:
      operationId: listAdminUsers
      summary: List accounts for identity administration
      description: >-
        Admin-only. By default returns active and blocked accounts while omitting deleted
        accounts; an explicit status filter selects one state. Search is a case-insensitive
        literal substring of email or display name. Query parameters must occur at most once,
        unknown parameters are rejected, and responses are never cached.
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, maximum: 10000, default: 0 }
        - name: q
          in: query
          description: Search text, maximum 100 Unicode code points after trimming whitespace.
          schema: { type: string, default: '' }
        - name: status
          in: query
          schema: { type: string, enum: [active, blocked, deleted] }
      responses:
        '200':
          description: Status-projected account rows and pagination.
          headers:
            X-Request-ID: { $ref: '#/components/headers/RequestID' }
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminUserPage' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/v1/admin/users/{id}:
    delete:
      operationId: deleteAdminUser
      summary: Soft-delete an account
      description: >-
        Admin-only. Marks a non-admin target deleted and disabled and revokes its sessions.
        Deleted and unknown targets are indistinguishable. Requires one matching Origin header,
        accepts no query parameters, and responses are never cached.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204':
          description: The account was soft-deleted and its sessions were revoked.
          headers:
            X-Request-ID: { $ref: '#/components/headers/RequestID' }
            Cache-Control: { $ref: '#/components/headers/NoStore' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/AdminUserMutationForbidden' }
        '404': { $ref: '#/components/responses/UserNotFound' }
        '409': { $ref: '#/components/responses/AdminUserConflict' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/v1/admin/users/{id}/status:
    post:
      operationId: setAdminUserStatus
      summary: Block or restore an account
      description: >-
        Admin-only and idempotent. Block revokes the target's sessions; restore makes a
        non-deleted target active. Requires one matching Origin header. Bodies are limited to
        8 KiB, accept no duplicate or unknown members, and responses are never cached.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminUserStatusRequest' }
      responses:
        '200':
          description: The requested status is in effect.
          headers:
            X-Request-ID: { $ref: '#/components/headers/RequestID' }
            Cache-Control: { $ref: '#/components/headers/NoStore' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/AdminUserMutationForbidden' }
        '404': { $ref: '#/components/responses/UserNotFound' }
        '409': { $ref: '#/components/responses/AdminUserConflict' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/v1/admin/users/{id}/password:
    post:
      operationId: resetAdminUserPassword
      summary: Reset an account password
      description: >-
        Admin-only. Replaces the credential and revokes every target session, including for a
        blocked target; a deleted target is not operable. Requires one matching Origin header.
        Bodies are limited to 8 KiB, accept no duplicate or unknown members, and responses are
        never cached. Passwords contain 1 to 1024 UTF-8 bytes; any content is accepted.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminUserPasswordRequest' }
      responses:
        '204':
          description: The password was reset and the target's sessions were revoked.
          headers:
            X-Request-ID: { $ref: '#/components/headers/RequestID' }
            Cache-Control: { $ref: '#/components/headers/NoStore' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/AdminUserMutationForbidden' }
        '404': { $ref: '#/components/responses/UserNotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/v1/admin/courses:
    get:
      operationId: listAdminCourses
      summary: List courses visible to the authenticated staff member
      description: >-
        Admins see every course. Instructors see only courses they own. Students and
        unrecognised roles are forbidden. Query parameters must occur at most once and
        unknown parameters are rejected. Responses are never cached.
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, maximum: 10000, default: 0 }
        - name: status
          in: query
          schema: { type: string, enum: [draft, published, archived] }
      responses:
        '200':
          description: Owner-scoped course rows and pagination.
          headers:
            X-Request-ID: { $ref: '#/components/headers/RequestID' }
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminCoursePage' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/Unavailable' }
    post:
      operationId: createAdminCourse
      summary: Create a draft course
      description: >-
        Creates a new draft with no modules. Instructors always become the owner and may
        omit instructorId or echo their own ID. Admins must choose an eligible active
        instructor or admin. The unique slug is the replay guard, so an identical replay
        returns slug_taken. Requires one matching Origin header. Bodies are limited to
        512 KiB, accept no duplicate or unknown members, and responses are never cached.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminCourseWrite' }
      responses:
        '201':
          description: The newly created draft course with a server-minted ID and empty tree.
          headers:
            X-Request-ID: { $ref: '#/components/headers/RequestID' }
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminCourseTree' }
        '400': { $ref: '#/components/responses/AdminWriteBadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/AdminMutationForbidden' }
        '409': { $ref: '#/components/responses/TranscriptConflict' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/v1/admin/courses/{id}:
    get:
      operationId: getAdminCourse
      summary: Get an authored course tree
      description: >-
        Admins may read any tree. An instructor may read only a tree they own. Unknown
        IDs are distinguished from ownership refusals for authenticated staff. Query
        parameters are not supported. Responses are never cached.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The complete authored course tree in module and lesson order.
          headers:
            X-Request-ID: { $ref: '#/components/headers/RequestID' }
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminCourseTree' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/Unavailable' }
    put:
      operationId: saveAdminCourse
      summary: Replace an authored course tree
      description: >-
        Replaces all editable course fields, modules and lessons. Array indexes define
        contiguous zero-based positions; lifecycle and position members are rejected.
        expectedUpdatedAt must be the exact RFC 3339 microsecond token returned by a read.
        Instructors may save only their own course and must omit instructorId or echo their
        own ID; admins may reassign to an eligible active instructor or admin. Slugs remain
        mutable only until first publication. Requires one matching Origin header. Bodies
        are limited to 512 KiB, accept no duplicate or unknown members, and responses are
        never cached.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminCourseSaveRequest' }
      responses:
        '200':
          description: The saved course tree with a new updatedAt token.
          headers:
            X-Request-ID: { $ref: '#/components/headers/RequestID' }
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminCourseTree' }
        '400': { $ref: '#/components/responses/AdminWriteBadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/AdminMutationForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/TranscriptConflict' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/Unavailable' }
    delete:
      operationId: deleteAdminCourse
      summary: Delete a draft course
      description: >-
        Permanently deletes a draft course and its tree. Published and archived courses
        cannot be deleted. expectedUpdatedAt must be the exact RFC 3339 microsecond token
        returned by a read. Instructors may delete only their own draft; admins may delete
        any draft. Requires one matching Origin header, accepts no duplicate or unknown
        body members, and responses are never cached.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminCourseDeleteRequest' }
      responses:
        '204':
          description: The draft course and its tree were deleted.
          headers:
            X-Request-ID: { $ref: '#/components/headers/RequestID' }
            Cache-Control: { $ref: '#/components/headers/NoStore' }
        '400': { $ref: '#/components/responses/AdminWriteBadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/AdminMutationForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/TranscriptConflict' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/v1/admin/courses/{id}/status:
    post:
      operationId: transitionAdminCourse
      summary: Publish, archive or restore a course
      description: >-
        Performs one legal lifecycle transition: draft to published, published to archived,
        or archived to published. expectedUpdatedAt must be the exact RFC 3339 microsecond
        token returned by a read, and every accepted transition returns a new token.
        Instructors may transition only their own course; admins may transition any course.
        Requires one matching Origin header, accepts no duplicate or unknown body members,
        and responses are never cached.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminCourseStatusRequest' }
      responses:
        '200':
          description: The transitioned course tree with a new updatedAt token.
          headers:
            X-Request-ID: { $ref: '#/components/headers/RequestID' }
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminCourseTree' }
        '400': { $ref: '#/components/responses/AdminWriteBadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/AdminMutationForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/TranscriptConflict' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/v1/admin/lessons/{lessonId}/video:
    post:
      operationId: mintAdminVideoTicket
      summary: Mint a video upload ticket
      description: >-
        Admins may mint for any saved lesson; instructors may mint only for lessons in courses
        they own. The minted video asset ID is also the single-use upload ticket ID. Requires
        one matching Origin header. Bodies are limited to 8 KiB, accept no duplicate or unknown
        members, and responses are never cached. The API records metadata only and does not
        access media storage.
      parameters:
        - name: lessonId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MediaTicketRequest' }
      responses:
        '201':
          description: A created asset and its resumable upload ticket.
          headers:
            X-Request-ID: { $ref: '#/components/headers/RequestID' }
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MediaUploadTicket' }
        '400': { $ref: '#/components/responses/MediaBadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/MediaForbidden' }
        '404': { $ref: '#/components/responses/LessonNotFound' }
        '409': { $ref: '#/components/responses/UploadConflict' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/v1/admin/courses/{courseId}/videos:
    get:
      operationId: listAdminCourseVideos
      summary: List a course's video assets
      description: >-
        Admins may read any course; instructors may read only courses they own. Returns one
        item per non-evicted asset, including multiple generations for a lesson. Storage keys
        and filesystem paths are never exposed. Query parameters are not supported and
        responses are never cached.
      parameters:
        - name: courseId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The course's non-evicted video assets, or an empty items array.
          headers:
            X-Request-ID: { $ref: '#/components/headers/RequestID' }
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CourseVideos' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/MediaForbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/v1/admin/videos/{videoId}/retry:
    post:
      operationId: retryAdminVideo
      summary: Retry video transcoding
      description: >-
        Admins may retry any owned asset; instructors may retry only assets in courses they
        own. A failed or queued asset may be retried, as may a processing asset whose claim is
        older than 40 minutes, but only after the complete source landed. Success clears any
        claim, increments the attempt and enqueues the asset. Requires one matching Origin
        header, accepts no query parameters, and responses are never cached.
      parameters:
        - name: videoId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The asset is queued for another transcoding attempt.
          headers:
            X-Request-ID: { $ref: '#/components/headers/RequestID' }
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MediaVideo' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/MediaForbidden' }
        '404': { $ref: '#/components/responses/VideoNotFound' }
        '409': { $ref: '#/components/responses/VideoNotRetryable' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/v1/admin/instructors:
    get:
      operationId: listInstructors
      summary: List eligible course owners
      description: >-
        Admin-only, unpaginated and bounded to 200 active instructor or admin accounts.
        Email, password data and account status are never exposed. Responses are never cached.
      responses:
        '200':
          description: Eligible owners in deterministic display-name and ID order.
          headers:
            X-Request-ID: { $ref: '#/components/headers/RequestID' }
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema:
                type: array
                maxItems: 200
                items: { $ref: '#/components/schemas/Instructor' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/v1/auth/login:
    post:
      operationId: login
      summary: Exchange credentials for a session
      description: >-
        Requires exactly one Origin header equal to the configured public origin; a missing,
        repeated, null or foreign origin is rejected. The body accepts only email and password,
        and rejects duplicate keys, unknown members, trailing content and bodies over 8 KiB.
        Unknown accounts and wrong passwords are indistinguishable. A success sets an HttpOnly,
        SameSite=Lax session cookie and revokes any session the request already presented.
        Responses are never cached.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: The authenticated user; the session token is returned only in the cookie.
          headers:
            X-Request-ID: { $ref: '#/components/headers/RequestID' }
            Cache-Control: { $ref: '#/components/headers/NoStore' }
            Set-Cookie: { $ref: '#/components/headers/SessionCookie' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthenticatedUser' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/PlaybackForbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/v1/auth/register:
    post:
      operationId: register
      summary: Register and start a session
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RegisterRequest' } } } }
      responses:
        '201': { description: Registered user and session cookie, content: { application/json: { schema: { $ref: '#/components/schemas/AuthenticatedUser' } } } }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '409': { $ref: '#/components/responses/EmailTaken' }
        '422': { $ref: '#/components/responses/AccountValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/v1/auth/verify-email:
    post:
      operationId: verifyEmail
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/TokenRequest' } } } }
      responses:
        '204': { description: Email verified. }
        '400': { $ref: '#/components/responses/InvalidAccountToken' }
        '410': { $ref: '#/components/responses/TokenUsed' }
  /api/v1/auth/resend-verification:
    post:
      operationId: resendVerification
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/OptionalEmailRequest' } } } }
      responses:
        '204': { description: Verification email was requested. }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
  /api/v1/auth/password/forgot:
    post:
      operationId: requestPasswordReset
      description: Returns 200 whether or not the email identifies an account.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/EmailRequest' } } } }
      responses:
        '200': { description: Reset request accepted. }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/v1/auth/password/reset:
    post:
      operationId: resetPassword
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ResetPasswordRequest' } } } }
      responses:
        '204': { description: Password reset and all sessions revoked. }
        '400': { $ref: '#/components/responses/InvalidAccountToken' }
        '410': { $ref: '#/components/responses/TokenUsed' }
        '422': { $ref: '#/components/responses/AccountValidationFailed' }
  /api/v1/auth/password/change:
    post:
      operationId: changePassword
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ChangePasswordRequest' } } } }
      responses:
        '204': { description: Password changed; other sessions revoked. }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '422': { $ref: '#/components/responses/AccountValidationFailed' }
  /api/v1/auth/email/change:
    post:
      operationId: requestEmailChange
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/NewEmailRequest' } } } }
      responses:
        '204': { description: Confirmation email requested. }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '409': { $ref: '#/components/responses/EmailTaken' }
        '422': { $ref: '#/components/responses/AccountValidationFailed' }
  /api/v1/auth/email/change/confirm:
    post:
      operationId: confirmEmailChange
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/TokenRequest' } } } }
      responses:
        '204': { description: Email changed and verified. }
        '400': { $ref: '#/components/responses/InvalidAccountToken' }
        '409': { $ref: '#/components/responses/EmailTaken' }
        '410': { $ref: '#/components/responses/TokenUsed' }
  /api/v1/auth/me:
    get:
      operationId: getCurrentUser
      summary: Read the authenticated user
      description: >-
        Resolves the session cookie. A missing, malformed, repeated, expired or revoked
        cookie returns the same 401, and a disabled account is treated as unauthenticated.
      responses:
        '200':
          description: The authenticated user.
          headers:
            X-Request-ID: { $ref: '#/components/headers/RequestID' }
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthenticatedUser' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/v1/auth/logout:
    post:
      operationId: logout
      summary: End the current session
      description: >-
        Requires the same single matching Origin header as login. Revocation is idempotent:
        an absent, malformed or already revoked session still returns 204 and still clears
        the cookie, so the response reveals nothing about session existence.
      responses:
        '204':
          description: The session is revoked and the cookie is cleared.
          headers:
            X-Request-ID: { $ref: '#/components/headers/RequestID' }
            Cache-Control: { $ref: '#/components/headers/NoStore' }
            Set-Cookie: { $ref: '#/components/headers/SessionCookie' }
        '403': { $ref: '#/components/responses/OriginForbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/v1/playback/sessions:
    post:
      operationId: createPlaybackSession
      summary: Mint a playback session for one lesson
      description: >-
        Authenticated same-origin mutation. The server selects the current highest-generation
        ready video for the lesson, checks course visibility before taking ownership, and always
        replaces the caller's previous playback slot on success. The client cannot name a video.
        Bodies are limited to 8 KiB and reject duplicate keys, unknown members and trailing content.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PlaybackSessionRequest' }
      responses:
        '201':
          description: A new playback session owns the account's single playback slot.
          headers:
            X-Request-ID: { $ref: '#/components/headers/RequestID' }
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlaybackSession' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/PlaybackForbidden' }
        '404': { $ref: '#/components/responses/PlaybackNotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/v1/learn/courses/{slug}:
    get:
      operationId: getLearningCourse
      summary: Get an authenticated course learning model
      description: >-
        Returns the ordered course program with module and lesson ids, the currently playable
        video state, and caller-specific progress. Missing progress is represented by concrete
        zero values. Draft and archived courses are visible only to their owner or an admin.
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 120
            pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
      responses:
        '200':
          description: Ordered learning content and caller-specific progress.
          headers:
            X-Request-ID: { $ref: '#/components/headers/RequestID' }
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LearningCourse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/LearningForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/v1/learn/lessons/{lessonId}/transcript:
    get:
      operationId: getLessonTranscript
      summary: Get a lesson transcript
      description: >-
        Returns the whole transcript of one lesson in a single response. It is deliberately not
        paginated: search runs on the client over what it was given, so a partial payload would
        make a miss indistinguishable from an absent word. The visibility rule is the one that
        governs watching the lesson - a transcript is not a second way into a course. Staleness is
        derived, not stored: the response says whether the text was written against a video the
        player would no longer pick. Omitting the language returns the only transcript when one
        exists, and the first by normalised code when several do.
      parameters:
        - name: lessonId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: language
          in: query
          required: false
          schema:
            type: string
            minLength: 2
            maxLength: 35
            pattern: '^[a-z][a-z0-9]{1,7}(-[a-z0-9]{1,8})*$'
      responses:
        '200':
          description: The whole transcript of the lesson.
          headers:
            X-Request-ID: { $ref: '#/components/headers/RequestID' }
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LessonTranscript' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/LearningForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/v1/admin/courses/{courseId}/documents:
    get:
      operationId: listCourseDocuments
      summary: List the course document library
      description: >-
        The library is an authoring surface: a document is stored once per course and segments
        reference it by id, so the same link is never carried twice on the wire. Visible to whoever
        may edit the course, not to whoever may watch it.
      parameters:
        - name: courseId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The course library.
          headers:
            X-Request-ID: { $ref: '#/components/headers/RequestID' }
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [documents]
                properties:
                  documents:
                    type: array
                    maxItems: 200
                    items: { $ref: '#/components/schemas/TranscriptDocumentLink' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/LearningForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/Unavailable' }
    post:
      operationId: addCourseDocument
      summary: Add a document to the course library
      description: >-
        Only http(s) is accepted, and a path under /media/ is refused outright: a transcript must
        not become a second way to name media bytes.
      parameters:
        - name: courseId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TranscriptDocumentLink' }
      responses:
        '201':
          description: The document was added.
          headers:
            X-Request-ID: { $ref: '#/components/headers/RequestID' }
            Cache-Control: { $ref: '#/components/headers/NoStore' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/LearningForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/TranscriptConflict' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/v1/admin/courses/{courseId}/documents/{documentId}:
    delete:
      operationId: removeCourseDocument
      summary: Remove a document from the course library
      description: >-
        Refused while any segment still references it, so a reference can never point at nothing.
        This governs the author's action only; deleting the course still cascades.
      parameters:
        - name: courseId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: documentId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204':
          description: The document was removed.
          headers:
            X-Request-ID: { $ref: '#/components/headers/RequestID' }
            Cache-Control: { $ref: '#/components/headers/NoStore' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/LearningForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/TranscriptConflict' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/v1/admin/lessons/{lessonId}/transcript:
    put:
      operationId: saveLessonTranscript
      summary: Replace a lesson transcript
      description: >-
        Authenticated same-origin mutation, scoped to the course owner or an admin. The write
        REPLACES the transcript of one lesson in one language: the author edits a document, not a
        set of rows, and a partial write would need a merge rule nobody asked for. expectedUpdatedAt
        is the optimistic-lock token and is omitted when the author believes no transcript exists;
        a second writer racing into the same empty lesson is refused with transcript_exists rather
        than appending to the first one's work.
      parameters:
        - name: lessonId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SaveTranscriptRequest' }
      responses:
        '200':
          description: The transcript was replaced.
          headers:
            X-Request-ID: { $ref: '#/components/headers/RequestID' }
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [updatedAt]
                properties:
                  updatedAt: { type: string, format: date-time }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/LearningForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/TranscriptConflict' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/v1/admin/lessons/{lessonId}/draft:
    get:
      operationId: getLessonDraft
      summary: Get a lesson recognition draft
      description: >-
        Returns the machine-produced draft for an editable lesson. A lesson without a draft is
        still a successful read: state, language, failure, updatedAt, assetId and generation are
        null and segments is empty. Responses are never cached.
      parameters:
        - name: lessonId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The lesson draft, or the empty draft state.
          headers:
            X-Request-ID: { $ref: '#/components/headers/RequestID' }
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LessonDraft' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/LessonNotFound' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/v1/admin/lessons/{lessonId}/draft/regenerate:
    post:
      operationId: regenerateLessonDraft
      summary: Queue lesson speech recognition
      description: >-
        Authenticated same-origin mutation for the course owner or an admin. An omitted language
        asks the recognizer to detect it. The body is optional, accepts no unknown members and is
        limited to 1 KiB. Responses are never cached.
      parameters:
        - name: lessonId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegenerateLessonDraftRequest' }
      responses:
        '202':
          description: Recognition was queued.
          headers:
            X-Request-ID: { $ref: '#/components/headers/RequestID' }
            Cache-Control: { $ref: '#/components/headers/NoStore' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/AdminMutationForbidden' }
        '404': { $ref: '#/components/responses/LessonNotFound' }
        '409': { $ref: '#/components/responses/DraftConflict' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/v1/admin/lessons/{lessonId}/draft/publish:
    post:
      operationId: publishLessonDraft
      summary: Publish a lesson recognition draft
      description: >-
        Authenticated same-origin mutation for the course owner or an admin. It publishes through
        the normal transcript write path and uses expectedUpdatedAt as its optimistic-lock token.
        The body is optional, accepts no unknown members and is limited to 1 KiB. Responses are
        never cached.
      parameters:
        - name: lessonId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PublishLessonDraftRequest' }
      responses:
        '200':
          description: The draft was published as the lesson transcript.
          headers:
            X-Request-ID: { $ref: '#/components/headers/RequestID' }
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [updatedAt]
                properties:
                  updatedAt: { type: string, format: date-time }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/AdminMutationForbidden' }
        '404': { $ref: '#/components/responses/LessonNotFound' }
        '409': { $ref: '#/components/responses/TranscriptConflict' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/v1/courses/{slug}/reviews:
    get:
      operationId: listCourseReviews
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
        - name: cursor
          in: query
          schema: { type: string, minLength: 1 }
      responses:
        '200': { description: Public reviews, content: { application/json: { schema: { $ref: '#/components/schemas/PublicReviewPage' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/v1/learn/courses/{courseId}/reviews:
    get:
      operationId: listLearningCourseReviews
      parameters:
        - name: courseId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: cursor
          in: query
          schema: { type: string, minLength: 1 }
      responses:
        '200': { description: Reviews visible to the learner, content: { application/json: { schema: { $ref: '#/components/schemas/PublicReviewPage' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/v1/learn/courses/{courseId}/review:
    get:
      operationId: getOwnCourseReview
      parameters: [ { name: courseId, in: path, required: true, schema: { type: string, format: uuid } } ]
      responses:
        '200': { description: Own review and current eligibility, content: { application/json: { schema: { $ref: '#/components/schemas/OwnReview' } } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/Unavailable' }
    put:
      operationId: putCourseReview
      parameters: [ { name: courseId, in: path, required: true, schema: { type: string, format: uuid } } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PutReviewRequest' } } } }
      responses:
        '200': { description: Updated review, content: { application/json: { schema: { $ref: '#/components/schemas/Review' } } } }
        '201': { description: Created review, content: { application/json: { schema: { $ref: '#/components/schemas/Review' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/TranscriptConflict' }
        '503': { $ref: '#/components/responses/Unavailable' }
    delete:
      operationId: deleteCourseReview
      parameters: [ { name: courseId, in: path, required: true, schema: { type: string, format: uuid } } ]
      responses:
        '204': { description: Review deleted }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/TranscriptConflict' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/v1/learn/reviews/{reviewId}/reports:
    post:
      operationId: reportCourseReview
      parameters: [ { name: reviewId, in: path, required: true, schema: { type: string, format: uuid } } ]
      responses:
        '204': { description: Report accepted }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
