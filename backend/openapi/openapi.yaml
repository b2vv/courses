            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/AdminCourseDeleteRequest'
                required: true
            responses:
                "204":
                    description: The draft course and its tree were deleted.
                    headers:
                        Cache-Control:
                            $ref: '#/components/headers/NoStore'
