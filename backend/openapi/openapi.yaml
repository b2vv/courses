                    $ref: '#/components/responses/Unauthenticated'
                "403":
                    $ref: '#/components/responses/LearningForbidden'
                "404":
                    $ref: '#/components/responses/NotFound'
                "409":
                    $ref: '#/components/responses/LessonDocumentConflict'
                "500":
