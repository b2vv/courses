            description: Returns the ordered course program with module and lesson ids, the currently playable video state, and caller-specific progress. Missing progress is represented by concrete zero values. Draft and archived courses are visible only to their owner or an admin.
            operationId: getLearningCourse
            parameters:
                - in: path
                  name: slug
                  required: true
                  schema:
                    maxLength: 120
                    minLength: 1
                    pattern: ^[a-z0-9]+(-[a-z0-9]+)*$
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/LearningCourse'
                    description: Ordered learning content and caller-specific progress.
                    headers:
                        Cache-Control:
                            $ref: '#/components/headers/NoStore'
                        X-Request-ID:
                            $ref: '#/components/headers/RequestID'
                "400":
                    $ref: '#/components/responses/BadRequest'
                "401":
                    $ref: '#/components/responses/Unauthenticated'
                "403":
                    $ref: '#/components/responses/LearningForbidden'
                "404":
                    $ref: '#/components/responses/NotFound'
                "500":
                    $ref: '#/components/responses/InternalError'
                "503":
                    $ref: '#/components/responses/Unavailable'
            summary: Get an authenticated course learning model
