      properties:
        playbackId: { type: string, pattern: '^[0-9a-f]{32}$' }
        mediaPath:
          type: string
          pattern: '^/media/p/[0-9a-f]{32}/hls/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}/master\.m3u8$'
        clientSeq: { type: integer, format: int64, minimum: 0, maximum: 2147483647 }
        heartbeatSeconds: { type: integer, minimum: 1 }
        ownershipTtlSeconds: { type: integer, minimum: 3 }
    PlaybackHeartbeatRequest:
      type: object
      additionalProperties: false
      required: [playbackId, lessonId, positionSeconds, clientSeq, reason]
      properties:
        playbackId: { type: string, pattern: '^[0-9a-f]{32}$' }
        lessonId: { type: string, format: uuid }
        positionSeconds: { type: number, format: double, minimum: 0 }
        clientSeq: { type: integer, format: int64, minimum: 0, maximum: 2147483647 }
        reason: { type: string, enum: [tick, pause, seek, hide, nav, ended] }
    SaveTranscriptRequest:
      type: object
      additionalProperties: false
      required: [language, segments]
      properties:
        language:
          type: string
          minLength: 2
          maxLength: 35
          pattern: '^[a-z][a-z0-9]{1,7}(-[a-z0-9]{1,8})*$'
        expectedUpdatedAt: { type: string, format: date-time }
        segments:
          type: array
          maxItems: 5000
          items:
            type: object
            additionalProperties: false
            required: [id, startMs, endMs, text, documentIds]
            properties:
              id: { type: string, format: uuid }
              startMs: { type: integer, format: int64, minimum: 0 }
              endMs: { type: integer, format: int64, minimum: 0 }
              text: { type: string, minLength: 1, maxLength: 1000 }
              speaker: { type: string, nullable: true, minLength: 1, maxLength: 100 }
              confidence: { type: number, format: double, nullable: true, minimum: 0, maximum: 1 }
              documentIds:
                type: array
                maxItems: 3
                items: { type: string, format: uuid }
    RegenerateLessonDraftRequest:
      type: object
      additionalProperties: false
      properties:
        language:
          type: string
          minLength: 2
          maxLength: 35
          pattern: '^[a-z][a-z0-9]{1,7}(-[a-z0-9]{1,8})*$'
    PublishLessonDraftRequest:
      type: object
      additionalProperties: false
      properties:
        expectedUpdatedAt: { type: string, format: date-time }
    LessonDraft:
      type: object
      additionalProperties: false
      required: [lessonId, state, language, failure, stale, updatedAt, assetId, generation, segments]
      properties:
        lessonId: { type: string, format: uuid }
        state:
          type: string
          nullable: true
          enum: [queued, running, ready, failed, no_speech]
          description: Null when recognition has not created a draft row yet.
        language:
          type: string
          nullable: true
          minLength: 2
          maxLength: 35
          pattern: '^[a-z][a-z0-9]{1,7}(-[a-z0-9]{1,8})*$'
        failure:
          type: string
          nullable: true
          minLength: 1
          maxLength: 200
        stale:
          type: boolean
          description: True when the draft was made from a previous ready video generation.
        updatedAt: { type: string, format: date-time, nullable: true }
        assetId: { type: string, format: uuid, nullable: true }
        generation: { type: integer, format: int32, minimum: 1, nullable: true }
        segments:
          type: array
          maxItems: 5000
          items: { $ref: '#/components/schemas/DraftSegment' }
    DraftSegment:
      type: object
      additionalProperties: false
      required: [id, startMs, endMs, text]
      properties:
        id: { type: string, format: uuid }
        startMs: { type: integer, format: int64, minimum: 0 }
        endMs:
          type: integer
          format: int64
          minimum: 0
          description: Must be greater than or equal to startMs.
        text: { type: string, minLength: 1, maxLength: 1000 }
        speaker: { type: string, minLength: 1, maxLength: 100 }
        confidence: { type: number, format: double, minimum: 0, maximum: 1 }
    LessonTranscript:
      type: object
      additionalProperties: false
      required: [lessonId, language, updatedAt, stale, segments, documents]
      properties:
        lessonId: { type: string, format: uuid }
        language:
          type: string
          nullable: true
          minLength: 2
          maxLength: 35
          description: >-
            Null when the lesson has no transcript. An absent transcript is a state of the lesson,
            not a missing resource, so the read answers 200 with an empty body rather than 404 —
            404 would be answered identically for a lesson that does not exist, which is the one
            thing this read must not leak.
        updatedAt:
          type: string
          format: date-time
          nullable: true
          description: >-
            The optimistic-lock token to send back when saving, null when the lesson has no
            transcript. Without it on the read an author could never obtain the token the write
            demands, and the editing loop could not close.
        stale:
          type: boolean
          description: >-
            Derived at read time by comparing the generation the text was written against with the
            generation the player would pick now. A lesson with no ready video is never stale.
        segments:
          type: array
          maxItems: 5000
          items: { $ref: '#/components/schemas/TranscriptSegment' }
        documents:
          type: array
          maxItems: 200
          description: >-
            Every document referenced by any segment, carried once. A document belongs to the
            course library and is stored once per course, so inlining it into each of up to 5000
            segments would send the same bytes back up to 15000 times: measured on the declared
            maxima, that is 75 MiB against 13 MiB for the same content. Segments reference by id.
          items: { $ref: '#/components/schemas/TranscriptDocumentLink' }
    TranscriptSegment:
      type: object
      additionalProperties: false
      required: [id, startMs, endMs, text, documentIds]
      properties:
        id: { type: string, format: uuid }
        startMs: { type: integer, format: int64, minimum: 0 }
        endMs: { type: integer, format: int64, minimum: 0 }
        text: { type: string, minLength: 1, maxLength: 1000 }
        speaker: { type: string, nullable: true, minLength: 1, maxLength: 100 }
        confidence: { type: number, format: double, nullable: true, minimum: 0, maximum: 1 }
        documentIds:
          type: array
          maxItems: 3
          items: { type: string, format: uuid }
    TranscriptDocumentLink:
      type: object
      additionalProperties: false
      required: [id, label, url]
      properties:
        id: { type: string, format: uuid }
