    /api/v1/teach/lessons/{lessonId}/document:
        get:
            description: Owner-instructor read of the draft and its optimistic-lock token, scoped to the lesson's course owner. An absent draft has updatedAt null.
            operationId: getTeachLessonDocument
            parameters:
                - in: path
                  name: lessonId
                  required: true
                  schema:
                    format: uuid
                    type: string
                - in: query
                  name: locale
                  schema:
                    default: uk
                    enum:
                        - uk
                        - en
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/LessonDocumentDraft'
                    description: Success.
