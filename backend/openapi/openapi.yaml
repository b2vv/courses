info:
    description: Public catalog, session authentication, protected administration, learning purchases and playback-session control.
    title: Courses API
    version: 1.0.0
openapi: 3.0.3
paths:
    /api/v1/admin/courses:
        get:
            description: Admins see every course. Instructors see only courses they own. Students and unrecognised roles are forbidden. Query parameters must occur at most once and unknown parameters are rejected. Responses are never cached.
            operationId: listAdminCourses
            parameters:
                - in: query
                  name: limit
                  schema:
                    default: 20
                    maximum: 50
                    minimum: 1
                    type: integer
                - in: query
                  name: offset
                  schema:
                    default: 0
                    maximum: 10000
                    minimum: 0
                    type: integer
                - description: Full-text filter over course title and summary. Rejected when empty.
                  in: query
                  name: search
                  schema:
                    maxLength: 100
                    minLength: 1
                    type: string
                - description: 'Ordering of the page. Each key has one natural direction: title A→Z, students and price highest first, recent (the default) newest first. Rejected when empty.'
                  in: query
                  name: sort
                  schema:
                    default: recent
                    enum:
                        - recent
                        - title
                        - students
                        - price
                    type: string
                - in: query
                  name: status
                  schema:
                    enum:
                        - draft
                        - published
                        - archived
                    type: string
            responses:
                "200":
                    content:
