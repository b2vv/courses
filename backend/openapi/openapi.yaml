    /api/v1/admin/courses/{id}:
        delete:
            description: Permanently deletes a draft course and its tree. Published and archived courses cannot be deleted. expectedUpdatedAt must be the exact RFC 3339 microsecond token returned by a read. Instructors may delete only their own draft; admins may delete any draft. Requires one matching Origin header, accepts no duplicate or unknown body members, and responses are never cached.
