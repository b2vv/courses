    /api/v1/admin/stats:
        get:
            description: Admin-only. A point-in-time aggregate across people, content, access and sales, moderation and media, plus the per-instructor leaderboard and the single-instructor flag. Accepts no query parameters and responses are never cached.
            operationId: getAdminStats
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/AdminStatsSnapshot'
                    description: The platform snapshot.
                    headers:
                        Cache-Control:
                            $ref: '#/components/headers/NoStore'
                        X-Request-ID:
                            $ref: '#/components/headers/RequestID'
                "401":
                    $ref: '#/components/responses/Unauthenticated'
                "403":
                    $ref: '#/components/responses/GrantForbidden'
                "500":
                    $ref: '#/components/responses/InternalError'
                "503":
                    $ref: '#/components/responses/Unavailable'
            summary: Platform statistics snapshot
    /api/v1/admin/stats/timeseries:
        get:
            description: Admin-only. Buckets one metric (signups, enrollments, orders or revenue) by day or week over a UTC window. Revenue buckets by paid time, enrollments by grant time, the rest by creation time. An unparseable or inverted range is invalid_range; a window wider than the bucket cap is range_too_wide; an unknown metric or bucket is rejected. Responses are never cached.
            operationId: getAdminStatsTimeseries
            parameters:
                - in: query
                  name: bucket
                  required: true
                  schema:
                    enum:
                        - day
                        - week
                    type: string
                - description: Inclusive RFC 3339 start; defaults to `to` minus 30 days.
                  in: query
                  name: from
                  schema:
                    format: date-time
                    type: string
                - in: query
                  name: metric
                  required: true
                  schema:
                    enum:
                        - signups
                        - enrollments
                        - orders
                        - revenue
                    type: string
                - description: Inclusive RFC 3339 end; defaults to now.
                  in: query
                  name: to
                  schema:
                    format: date-time
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/AdminStatsTimeseries'
                    description: Ordered timeseries buckets.
                    headers:
                        Cache-Control:
                            $ref: '#/components/headers/NoStore'
                        X-Request-ID:
                            $ref: '#/components/headers/RequestID'
                "400":
                    $ref: '#/components/responses/InvalidRequest'
                "401":
                    $ref: '#/components/responses/Unauthenticated'
                "403":
                    $ref: '#/components/responses/GrantForbidden'
                "500":
                    $ref: '#/components/responses/InternalError'
                "503":
                    $ref: '#/components/responses/Unavailable'
            summary: Platform statistics timeseries
    /api/v1/admin/users:
        get:
            description: Admin-only. By default returns active and blocked accounts while omitting deleted accounts; an explicit status filter selects one state. Search is a case-insensitive literal substring of email or display name. Query parameters must occur at most once, unknown parameters are rejected, and responses are never cached.
            operationId: listAdminUsers
            parameters:
                - in: query
                  name: limit
                  schema:
                    default: 20
                    maximum: 50
                    minimum: 1
                    type: integer
                - in: query
                  name: offset
                  schema:
                    default: 0
                    maximum: 10000
                    minimum: 0
                    type: integer
                - description: Search text, maximum 100 Unicode code points after trimming whitespace.
                  in: query
                  name: q
                  schema:
                    default: ""
                    type: string
                - description: Optional single-role filter; omitted returns every role.
                  in: query
                  name: role
                  schema:
                    enum:
                        - student
                        - instructor
                        - admin
                    type: string
                - description: Row ordering; omitted or 'email' sorts by email, 'name' by display name, 'recent' by newest account first.
                  in: query
                  name: sort
                  schema:
                    enum:
                        - email
                        - name
                        - recent
                    type: string
                - in: query
                  name: status
                  schema:
                    enum:
                        - active
                        - blocked
                        - deleted
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/AdminUserPage'
                    description: Status-projected account rows and pagination.
                    headers:
                        Cache-Control:
                            $ref: '#/components/headers/NoStore'
                        X-Request-ID:
                            $ref: '#/components/headers/RequestID'
                "400":
                    $ref: '#/components/responses/InvalidRequest'
                "401":
                    $ref: '#/components/responses/Unauthenticated'
                "403":
                    $ref: '#/components/responses/Forbidden'
                "500":
                    $ref: '#/components/responses/InternalError'
                "503":
                    $ref: '#/components/responses/Unavailable'
            summary: List accounts for identity administration
    /api/v1/admin/users/{id}:
        delete:
            description: Admin-only. Marks a non-admin target deleted and disabled and revokes its sessions. Deleted and unknown targets are indistinguishable. Requires one matching Origin header, accepts no query parameters, and responses are never cached.
