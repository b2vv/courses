    /api/v1/admin/lessons/{lessonId}/transcript:
        put:
            description: 'Authenticated same-origin mutation, scoped to the course owner or an admin. The write REPLACES the transcript of one lesson in one language: the author edits a document, not a set of rows, and a partial write would need a merge rule nobody asked for. expectedUpdatedAt is the optimistic-lock token and is omitted when the author believes no transcript exists; a second writer racing into the same empty lesson is refused with transcript_exists rather than appending to the first one''s work.'
            operationId: saveLessonTranscript
            parameters:
                - in: path
                  name: lessonId
                  required: true
                  schema:
                    format: uuid
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/SaveTranscriptRequest'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                additionalProperties: false
                                properties:
                                    updatedAt:
                                        format: date-time
                                        type: string
                                required:
                                    - updatedAt
                                type: object
                    description: The transcript was replaced.
                    headers:
                        Cache-Control:
                            $ref: '#/components/headers/NoStore'
                        X-Request-ID:
                            $ref: '#/components/headers/RequestID'
                "400":
                    $ref: '#/components/responses/BadRequest'
                "401":
                    $ref: '#/components/responses/Unauthenticated'
                "403":
                    $ref: '#/components/responses/LearningForbidden'
                "404":
                    $ref: '#/components/responses/NotFound'
                "409":
                    $ref: '#/components/responses/TranscriptConflict'
                "500":
                    $ref: '#/components/responses/InternalError'
                "503":
                    $ref: '#/components/responses/Unavailable'
            summary: Replace a lesson transcript
    /api/v1/admin/lessons/{lessonId}/video:
        post:
            description: Admins may mint for any saved lesson; instructors may mint only for lessons in courses they own. The minted video asset ID is also the single-use upload ticket ID. Requires one matching Origin header. Bodies are limited to 8 KiB, accept no duplicate or unknown members, and responses are never cached. The API records metadata only and does not access media storage.
