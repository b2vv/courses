    /api/v1/admin/users/{id}/password:
        post:
            description: Admin-only. Replaces the credential and revokes every target session, including for a blocked target; a deleted target is not operable. Requires one matching Origin header. Bodies are limited to 8 KiB, accept no duplicate or unknown members, and responses are never cached. Passwords contain 1 to 1024 UTF-8 bytes; any content is accepted.
