    /api/v1/admin/videos/{videoId}/retry:
        post:
            description: Admins may retry any owned asset; instructors may retry only assets in courses they own. A failed or queued asset may be retried, as may a processing asset whose claim is older than 40 minutes, but only after the complete source landed. Success clears any claim, increments the attempt and enqueues the asset. Requires one matching Origin header, accepts no query parameters, and responses are never cached.
            operationId: retryAdminVideo
            parameters:
                - in: path
                  name: videoId
                  required: true
                  schema:
                    format: uuid
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/MediaVideo'
                    description: The asset is queued for another transcoding attempt.
                    headers:
                        Cache-Control:
                            $ref: '#/components/headers/NoStore'
