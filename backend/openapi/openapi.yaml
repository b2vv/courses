            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    format: uuid
                    type: string
            responses:
                "204":
                    description: The account was soft-deleted and its sessions were revoked.
                    headers:
                        Cache-Control:
                            $ref: '#/components/headers/NoStore'
