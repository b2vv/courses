                  schema:
                    format: uuid
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/AdminCourseTree'
                    description: The complete authored course tree in module and lesson order.
                    headers:
                        Cache-Control:
                            $ref: '#/components/headers/NoStore'
                        X-Request-ID:
                            $ref: '#/components/headers/RequestID'
                "400":
                    $ref: '#/components/responses/InvalidRequest'
                "401":
                    $ref: '#/components/responses/Unauthenticated'
                "403":
                    $ref: '#/components/responses/Forbidden'
                "404":
                    $ref: '#/components/responses/NotFound'
                "500":
                    $ref: '#/components/responses/InternalError'
                "503":
                    $ref: '#/components/responses/Unavailable'
            summary: Get an authored course tree
        put:
            description: Replaces all editable course fields, modules and lessons. Array indexes define contiguous zero-based positions; lifecycle and position members are rejected. expectedUpdatedAt must be the exact RFC 3339 microsecond token returned by a read. Instructors may save only their own course and must omit instructorId or echo their own ID; admins may reassign to an eligible active instructor or admin. Slugs remain mutable only until first publication. Requires one matching Origin header. Bodies are limited to 512 KiB, accept no duplicate or unknown members, and responses are never cached.
            operationId: saveAdminCourse
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    format: uuid
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/AdminCourseSaveRequest'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
