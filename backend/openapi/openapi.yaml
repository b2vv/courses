                required: true
            responses:
                "204":
                    description: Email changed and verified.
                "400":
                    $ref: '#/components/responses/InvalidAccountToken'
                "409":
                    $ref: '#/components/responses/EmailTaken'
                "410":
                    $ref: '#/components/responses/TokenUsed'
    /api/v1/auth/login:
        post:
            description: Requires exactly one Origin header equal to the configured public origin; a missing, repeated, null or foreign origin is rejected. The body accepts only email and password, and rejects duplicate keys, unknown members, trailing content and bodies over 8 KiB. Unknown accounts and wrong passwords are indistinguishable. A success sets an HttpOnly, SameSite=Lax session cookie and revokes any session the request already presented. Responses are never cached.
            operationId: login
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/LoginRequest'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                oneOf:
                                    - $ref: '#/components/schemas/AuthenticatedUser'
                                    - $ref: '#/components/schemas/TwoFactorRequired'
                    description: The authenticated user, or a pending two-factor challenge. A session cookie is set only for the authenticated-user variant.
                    headers:
                        Cache-Control:
                            $ref: '#/components/headers/NoStore'
                        Set-Cookie:
                            $ref: '#/components/headers/SessionCookie'
                        X-Request-ID:
                            $ref: '#/components/headers/RequestID'
                "400":
                    $ref: '#/components/responses/InvalidRequest'
                "401":
                    $ref: '#/components/responses/Unauthenticated'
                "403":
                    $ref: '#/components/responses/PlaybackForbidden'
                "500":
                    $ref: '#/components/responses/InternalError'
                "503":
                    $ref: '#/components/responses/Unavailable'
            summary: Exchange credentials for a session
    /api/v1/auth/logout:
        post:
            description: 'Requires the same single matching Origin header as login. Revocation is idempotent: an absent, malformed or already revoked session still returns 204 and still clears the cookie, so the response reveals nothing about session existence.'
            operationId: logout
            responses:
                "204":
                    description: The session is revoked and the cookie is cleared.
                    headers:
                        Cache-Control:
                            $ref: '#/components/headers/NoStore'
                        Set-Cookie:
                            $ref: '#/components/headers/SessionCookie'
                        X-Request-ID:
                            $ref: '#/components/headers/RequestID'
                "403":
                    $ref: '#/components/responses/OriginForbidden'
                "500":
                    $ref: '#/components/responses/InternalError'
                "503":
                    $ref: '#/components/responses/Unavailable'
            summary: End the current session
    /api/v1/auth/me:
        get:
            description: Resolves the session cookie. A missing, malformed, repeated, expired or revoked cookie returns the same 401, and a disabled account is treated as unauthenticated.
            operationId: getCurrentUser
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/AuthenticatedUser'
                    description: The authenticated user.
                    headers:
