    /api/v1/client-logs:
        post:
            description: Unauthenticated by design so a pre-auth client error can still report. The body is one event; the server validates, redacts the §17 set and emits a structured log line. No body is returned. The endpoint is rate-limited by the nginx clientlog zone.
            operationId: ingestClientLog
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/ClientLogRequest'
                required: true
            responses:
                "204":
                    description: Event accepted; nothing is returned.
                "400":
                    $ref: '#/components/responses/BadRequest'
            summary: Ingest one browser-captured log event
    /api/v1/courses:
        get:
            description: Only published courses are visible. Search is PostgreSQL full-text match over title and summary (case-insensitive, word-based, space-separated terms ANDed, word order ignored); an empty search matches every published course. Query parameters must occur at most once; unknown parameters are rejected. Limit and offset accept decimal digits only. Search is trimmed before validating a maximum of 100 Unicode code points; NUL is rejected. List and total share one database snapshot.
            operationId: listPublishedCourses
            parameters:
                - in: query
                  name: limit
                  schema:
                    default: 20
                    maximum: 50
                    minimum: 1
                    type: integer
                - in: query
                  name: offset
                  schema:
                    default: 0
                    maximum: 10000
                    minimum: 0
                    type: integer
                - description: Search text, maximum 100 Unicode code points after trimming whitespace.
                  in: query
                  name: q
                  schema:
                    default: ""
                    type: string
                - description: Recent orders by publishedAt descending then ID ascending; title uses PostgreSQL C collation then ID ascending.
                  in: query
                  name: sort
                  schema:
                    default: recent
                    enum:
                        - recent
                        - title
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/CoursePage'
                    description: Published courses and pagination, including an empty items array when beyond the final page.
                    headers:
                        X-Request-ID:
                            $ref: '#/components/headers/RequestID'
                "400":
                    $ref: '#/components/responses/BadRequest'
                "500":
                    $ref: '#/components/responses/InternalError'
                "503":
                    $ref: '#/components/responses/Unavailable'
            summary: List published courses
    /api/v1/courses/{slug}:
        get:
            description: Draft, archived and unknown courses all return the same 404 response. The program contains ordered module titles and ordered lesson titles only; it exposes no ids, positions or ownership. Query parameters are not supported.
            operationId: getPublishedCourse
            parameters:
                - in: path
                  name: slug
                  required: true
                  schema:
                    maxLength: 120
                    minLength: 1
                    pattern: ^[a-z0-9]+(-[a-z0-9]+)*$
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/CourseDetail'
                    description: Published course with its ordered title-only program.
                    headers:
                        X-Request-ID:
                            $ref: '#/components/headers/RequestID'
                "400":
