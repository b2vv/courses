  /api/v1/playback/heartbeat:
    post:
      operationId: heartbeatPlayback
      summary: Renew playback ownership and save lesson progress
      description: >-
        Authenticated same-origin mutation. Only the current owner renews the slot and writes
        progress. A taken-over session and an expired session are distinct outcomes. Positions
        above the current video duration are accepted and clamped by the server.
        Bodies are limited to 8 KiB and reject duplicate keys, unknown members and trailing content.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PlaybackHeartbeatRequest' }
      responses:
        '204':
          description: Ownership was renewed and the progress update was processed.
          headers:
            X-Request-ID: { $ref: '#/components/headers/RequestID' }
            Cache-Control: { $ref: '#/components/headers/NoStore' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/PlaybackForbidden' }
        '404': { $ref: '#/components/responses/LessonNotFound' }
        '409': { $ref: '#/components/responses/PlaybackTakenOver' }
        '410': { $ref: '#/components/responses/PlaybackExpired' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/Unavailable' }
components:
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: User-scoped replay key for starting a course purchase.
      schema: { type: string, minLength: 1, maxLength: 128 }
  headers:
    RequestID:
      description: Server-generated correlation identifier.
      required: true
      schema: { type: string, pattern: '^[a-f0-9]{32}$' }
    NoStore:
      description: This response is never stored by caches or shared proxies.
      required: true
      schema: { type: string, enum: [no-store] }
    SessionCookie:
      description: Opaque session cookie; HttpOnly and SameSite=Lax, Secure when configured.
      required: true
      schema: { type: string }
  schemas:
    LessonDocument:
      type: object
      additionalProperties: false
      required: [schemaVersion, locale, sections]
      properties:
        schemaVersion: { type: integer, enum: [1] }
        locale: { type: string, enum: [uk, en] }
        sections:
          type: array
          nullable: true
          items: { $ref: '#/components/schemas/LessonSection' }
    LessonSection:
      type: object
      additionalProperties: false
      required: [id, type]
      properties:
        id: { type: string }
        type: { type: string, enum: [video, text, image, row, task] }
        content:
          type: object
          nullable: true
          allOf:
            - $ref: '#/components/schemas/LessonRichText'
        imageId: { type: string }
        contentType: { type: string, enum: [image/jpeg, image/png, image/webp] }
        alt: { type: string }
        columns:
          type: array
          items: { $ref: '#/components/schemas/LessonSection' }
    LessonRichText:
      type: object
      additionalProperties: false
      required: [blocks]
      properties:
        blocks:
          type: array
          nullable: true
          items: { $ref: '#/components/schemas/LessonBlock' }
    LessonBlock:
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type: { type: string, enum: [paragraph, heading, list] }
        level: { type: integer }
        ordered: { type: boolean }
        spans:
          type: array
          items: { $ref: '#/components/schemas/LessonSpan' }
        items:
          type: array
          items:
            type: array
            nullable: true
            items: { $ref: '#/components/schemas/LessonSpan' }
    LessonSpan:
      type: object
      additionalProperties: false
      required: [text]
      properties:
        text: { type: string }
        marks:
          type: array
          items: { type: string, enum: [bold, italic] }
        href: { type: string }
    LessonDocumentDraft:
      type: object
      additionalProperties: false
      required: [document, updatedAt]
      properties:
        document: { $ref: '#/components/schemas/LessonDocument' }
        updatedAt: { type: string, format: date-time, nullable: true }
    LessonDocumentUpdated:
      type: object
      additionalProperties: false
      required: [updatedAt]
      properties:
        updatedAt: { type: string, format: date-time }
    SaveLessonDocumentRequest:
      type: object
      additionalProperties: false
      required: [document]
      properties:
        expectedUpdatedAt: { type: string, format: date-time, nullable: true }
        document: { $ref: '#/components/schemas/LessonDocument' }
    PublishLessonDocumentRequest:
      type: object
      additionalProperties: false
      required: [expectedUpdatedAt]
      properties:
        expectedUpdatedAt: { type: string, format: date-time }
    PublishCommentRequest:
      type: object
      additionalProperties: false
      required: [body]
      properties:
        body: { type: string, minLength: 1, maxLength: 2000 }
        positionMs: { type: integer, format: int64, minimum: 0, nullable: true }
        parentId: { type: string, format: uuid, nullable: true }
    UpdateCommentRequest:
      type: object
      additionalProperties: false
      required: [body]
      properties:
        body: { type: string, minLength: 1, maxLength: 2000 }
    CommentAuthor:
      type: object
      additionalProperties: false
      required: [displayName]
      properties:
        displayName: { type: string, nullable: true }
    Comment:
      type: object
      additionalProperties: false
      required: [id, author, body, positionMs, createdAt, editedAt, removed, canEdit, canRemove]
      properties:
        id: { type: string, format: uuid }
        author: { $ref: '#/components/schemas/CommentAuthor' }
        body: { type: string, nullable: true }
        positionMs: { type: integer, format: int64, minimum: 0, nullable: true }
        createdAt: { type: string, format: date-time }
        editedAt: { type: string, format: date-time, nullable: true }
        removed: { type: boolean }
        canEdit: { type: boolean }
        canRemove: { type: boolean }
    CommentThread:
      type: object
      additionalProperties: false
      required: [root, replies]
      properties:
        root: { $ref: '#/components/schemas/Comment' }
        replies:
          type: array
          items: { $ref: '#/components/schemas/Comment' }
    CommentPage:
      type: object
      additionalProperties: false
      required: [threads, nextCursor]
      properties:
        threads:
          type: array
          maxItems: 50
          items: { $ref: '#/components/schemas/CommentThread' }
        nextCursor: { type: string, nullable: true }
    DismissReportsRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason: { type: string, minLength: 1, maxLength: 500 }
    ClientLogRequest:
      type: object
      additionalProperties: false
      required: [message]
      properties:
        level: { type: string, enum: [error, warn, info] }
        message: { type: string, maxLength: 2000 }
        route: { type: string, maxLength: 512 }
        release: { type: string, maxLength: 128 }
        userAgent: { type: string, maxLength: 256 }
        errorName: { type: string, maxLength: 256 }
        errorStack: { type: string, maxLength: 8000 }
    ParticipantReportRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason: { type: string, minLength: 1, maxLength: 500 }
    ParticipantReport:
      type: object
      additionalProperties: false
      required: [id, courseId, reporterId, targetId, kind, reason, state, createdAt]
      properties:
        id: { type: string, format: uuid }
        courseId: { type: string, format: uuid }
        reporterId: { type: string, format: uuid }
        targetId: { type: string, format: uuid }
        kind: { type: string, enum: [on_lecturer, on_student] }
        reason: { type: string, minLength: 1, maxLength: 500 }
        state: { type: string, enum: [open, resolved] }
