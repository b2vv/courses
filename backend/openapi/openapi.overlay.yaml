# Catalog-only S0.1 Run 1 overlay. Prose has no Go source.
# LIMITATION (N1): validation keywords are carried here, not derived from domain
# validators; they are NOT claimed drift-proof. Error-code enum is also temporary
# hand metadata until the S0.1 parser run (16.7 completion gate).
# Null deletes a key; $ref: null expands the generated schema before metadata merge.
# CourseDetail publishedAt/status narrowing is the published endpoint contract.
components:
    parameters:
        "IdempotencyKey": {"description": "User-scoped replay key for starting a course purchase.", "schema": {"minLength": 1, "maxLength": 128}}
    headers:
        SessionCookie:
          description: Opaque session cookie; HttpOnly and SameSite=Lax, Secure when configured.
          required: true
          schema: {}
        NoStore:
            description: This response is never stored by caches or shared proxies.
            schema:
                enum:
                    - no-store
        RequestID:
            description: Server-generated correlation identifier.
            schema:
                pattern: ^[a-f0-9]{32}$
    responses:
        LessonDocumentConflict:
            description: The lesson document changed since it was loaded.
            headers:
                X-Request-ID: { $ref: '#/components/headers/RequestID' }
                Cache-Control: { $ref: '#/components/headers/NoStore' }
        "OrderNotFound": {"description": "The order is unknown or belongs to another account.", "headers": {"X-Request-ID": {"$ref": "#/components/headers/RequestID"}, "Cache-Control": {"$ref": "#/components/headers/NoStore"}}}
        "MembershipConflict": {"description": "Enrollment is unavailable or changed concurrently.", "headers": {"X-Request-ID": {"$ref": "#/components/headers/RequestID"}, "Cache-Control": {"$ref": "#/components/headers/NoStore"}}}
        "PurchaseConflict": {"description": "The course is already owned or the price operation conflicted.", "headers": {"X-Request-ID": {"$ref": "#/components/headers/RequestID"}, "Cache-Control": {"$ref": "#/components/headers/NoStore"}}}
        EmailTaken:
          description: The email is already registered.
        AccountValidationFailed:
          description: Account input is invalid.
        RateLimited:
          description: Too many requests.
        InvalidAccountToken:
          description: The account token is malformed.
        TokenUsed:
          description: The one-time token has expired or was already used.
        TwoFactorConflict:
          description: Two-factor authentication is already enabled or is not enabled.
        TwoFactorInvalidCode:
          description: The supplied TOTP or recovery code is invalid.
        OriginForbidden:
          description: The request origin is missing, repeated or does not match the public
            origin.
          headers:
            X-Request-ID:
              "$ref": "#/components/headers/RequestID"
            Cache-Control:
              "$ref": "#/components/headers/NoStore"
        AdminUserMutationForbidden:
          description: The Origin is not allowed or the authenticated account is not an administrator.
          headers:
            X-Request-ID:
              "$ref": "#/components/headers/RequestID"
            Cache-Control:
              "$ref": "#/components/headers/NoStore"
        UserNotFound:
          description: The target account is unknown or deleted.
          headers:
            X-Request-ID:
              "$ref": "#/components/headers/RequestID"
            Cache-Control:
              "$ref": "#/components/headers/NoStore"
        AdminUserConflict:
          description: The operation targets the caller, targets an immutable admin, or would
            block the last active admin.
          headers:
            X-Request-ID:
              "$ref": "#/components/headers/RequestID"
            Cache-Control:
              "$ref": "#/components/headers/NoStore"
        AdminWriteBadRequest:
            description: "The body is missing, malformed, oversized, outside field/tree bounds, names an ineligible owner, or carries unexpected members."
            headers:
                Cache-Control:
                    $ref: "#/components/headers/NoStore"
                X-Request-ID:
                    $ref: "#/components/headers/RequestID"
        AdminMutationForbidden:
            description: "The Origin is not allowed, the actor is not staff, or the instructor does not own the course or attempted reassignment."
            headers:
                Cache-Control:
                    $ref: "#/components/headers/NoStore"
                X-Request-ID:
                    $ref: "#/components/headers/RequestID"
        DraftConflict:
            description: "Recognition is already running for the lesson's current video asset."
            headers:
                Cache-Control:
                    $ref: "#/components/headers/NoStore"
                X-Request-ID:
                    $ref: "#/components/headers/RequestID"
        Forbidden:
            description: "The authenticated actor lacks permission for the resource or operation."
            headers:
                Cache-Control:
                    $ref: "#/components/headers/NoStore"
                X-Request-ID:
                    $ref: "#/components/headers/RequestID"
        LearningForbidden:
            description: "The authenticated actor cannot view the requested course."
            headers:
                Cache-Control:
                    $ref: "#/components/headers/NoStore"
                X-Request-ID:
                    $ref: "#/components/headers/RequestID"
        TranscriptConflict:
            description: "The transcript changed under the author, or a second writer reached the same empty lesson first. Named so the editor can say which of the two happened."
            headers:
                Cache-Control:
                    $ref: "#/components/headers/NoStore"
                X-Request-ID:
                    $ref: "#/components/headers/RequestID"
        PlaybackForbidden:
          description: The Origin is not allowed or the authenticated actor cannot view the lesson's course.
          headers:
            X-Request-ID: { $ref: '#/components/headers/RequestID' }
            Cache-Control: { $ref: '#/components/headers/NoStore' }
        PlaybackNotFound:
          description: The lesson is unknown or has no current ready video.
          headers:
            X-Request-ID: { $ref: '#/components/headers/RequestID' }
            Cache-Control: { $ref: '#/components/headers/NoStore' }
        PlaybackTakenOver:
          description: Another playback session currently owns the account's playback slot.
          headers:
            X-Request-ID: { $ref: '#/components/headers/RequestID' }
            Cache-Control: { $ref: '#/components/headers/NoStore' }
        PlaybackExpired:
          description: The playback ownership record is unknown or expired.
          headers:
            X-Request-ID: { $ref: '#/components/headers/RequestID' }
            Cache-Control: { $ref: '#/components/headers/NoStore' }
        VideoNotRetryable:
          description: The video state is not retryable, its processing claim is still live, or its source never landed.
          headers:
            X-Request-ID: { $ref: '#/components/headers/RequestID' }
            Cache-Control: { $ref: '#/components/headers/NoStore' }
        VideoNotFound:
          description: The video is unknown or evicted.
          headers:
            X-Request-ID: { $ref: '#/components/headers/RequestID' }
            Cache-Control: { $ref: '#/components/headers/NoStore' }
        UploadConflict:
          description: The lesson already has a non-terminal, unexpired video asset.
          headers:
            X-Request-ID: { $ref: '#/components/headers/RequestID' }
            Cache-Control: { $ref: '#/components/headers/NoStore' }
        MediaBadRequest:
          description: The mint body is malformed, oversized or outside ticket bounds, including an upload over 2 GiB.
          headers:
            X-Request-ID: { $ref: '#/components/headers/RequestID' }
            Cache-Control: { $ref: '#/components/headers/NoStore' }
        MediaForbidden:
          description: The Origin is not allowed, the actor is not staff, or the instructor does not own the course.
          headers:
            X-Request-ID: { $ref: '#/components/headers/RequestID' }
            Cache-Control: { $ref: '#/components/headers/NoStore' }
        LessonNotFound:
          description: The lesson is unknown.
          headers:
            X-Request-ID: { $ref: '#/components/headers/RequestID' }
            Cache-Control: { $ref: '#/components/headers/NoStore' }
        GrantForbidden:
            description: Administrator permission is required to issue a grant.
            headers:
                X-Request-ID:
                    $ref: '#/components/headers/RequestID'
                Cache-Control:
                    $ref: '#/components/headers/NoStore'
        InvalidRequest:
            description: The request path, query or body is missing, malformed, oversized or carries unexpected members.
            headers:
                X-Request-ID:
                    $ref: '#/components/headers/RequestID'
                Cache-Control:
                    $ref: '#/components/headers/NoStore'
        Unauthenticated:
            description: Credentials were rejected or no usable session was presented.
            headers:
                X-Request-ID:
                    $ref: '#/components/headers/RequestID'
                Cache-Control:
                    $ref: '#/components/headers/NoStore'
        BadRequest:
            description: Invalid query parameters or slug.
            headers:
                X-Request-ID:
                    $ref: '#/components/headers/RequestID'
        InternalError:
            description: Unexpected error; internal details are never returned.
            headers:
                Cache-Control:
                    $ref: '#/components/headers/NoStore'
                X-Request-ID:
                    $ref: '#/components/headers/RequestID'
        NotFound:
            description: Course was not found.
            headers:
                Cache-Control:
                    $ref: '#/components/headers/NoStore'
                X-Request-ID:
                    $ref: '#/components/headers/RequestID'
        Unavailable:
            description: A dependency was unavailable or the bounded read timed out.
            headers:
                Cache-Control:
                    $ref: '#/components/headers/NoStore'
                X-Request-ID:
                    $ref: '#/components/headers/RequestID'
    schemas:
