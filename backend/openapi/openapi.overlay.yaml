        LessonTranscript:
            properties:
                documents:
                    description: "Every document referenced by any segment, carried once. A document belongs to the course library and is stored once per course, so inlining it into each of up to 5000 segments would send the same bytes back up to 15000 times: measured on the declared maxima, that is 75 MiB against 13 MiB for the same content. Segments reference by id."
                    maxItems: 200
                language:
                    description: "Null when the lesson has no transcript. An absent transcript is a state of the lesson, not a missing resource, so the read answers 200 with an empty body rather than 404 — 404 would be answered identically for a lesson that does not exist, which is the one thing this read must not leak."
                    maxLength: 35
                    minLength: 2
                lessonId:
                    format: "uuid"
                segments:
                    maxItems: 5000
                stale:
                    description: "Derived at read time by comparing the generation the text was written against with the generation the player would pick now. A lesson with no ready video is never stale."
                updatedAt:
                    description: "The optimistic-lock token to send back when saving, null when the lesson has no transcript. Without it on the read an author could never obtain the token the write demands, and the editing loop could not close."
                    format: "date-time"
