    /api/v1/admin/lessons/{lessonId}/document:
        get:
            operationId: getAdminLessonDocument
            description: Read the draft and its optimistic-lock token. An absent draft has updatedAt null.
            parameters:
                lessonId: { schema: { format: uuid } }
                locale: { schema: { default: uk } }
            responses:
                '200':
                    description: Success.
                    headers:
                        X-Request-ID: { $ref: '#/components/headers/RequestID' }
                        Cache-Control: { $ref: '#/components/headers/NoStore' }
        put:
            operationId: saveAdminLessonDocument
            description: Same-origin owner/admin write. Locale comes from the document; query parameters are forbidden. Null or absent expectedUpdatedAt means first write. Timestamps require six fractional digits. Maximum request body is 2 MiB.
            parameters:
                lessonId: { schema: { format: uuid } }
            responses:
                '200':
                    description: Success.
                    headers:
                        X-Request-ID: { $ref: '#/components/headers/RequestID' }
                        Cache-Control: { $ref: '#/components/headers/NoStore' }

    /api/v1/admin/lessons/{lessonId}/document/publish:
        post:
            operationId: publishAdminLessonDocument
            description: Same-origin owner/admin publish. Maximum request body is 1 KiB. Timestamps require six fractional digits. Publication advances updatedAt; re-read the draft for the new token.
            parameters:
                lessonId: { schema: { format: uuid } }
                locale: { schema: { default: uk } }
            responses:
                '200':
                    description: Success.
                    headers:
