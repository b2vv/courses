    /api/v1/learn/lessons/{lessonId}/transcript:
        get:
            description: 'Returns the whole transcript of one lesson in a single response. It is deliberately not paginated: search runs on the client over what it was given, so a partial payload would make a miss indistinguishable from an absent word. The visibility rule is the one that governs watching the lesson - a transcript is not a second way into a course. Staleness is derived, not stored: the response says whether the text was written against a video the player would no longer pick. Omitting the language returns the only transcript when one exists, and the first by normalised code when several do.'
            operationId: getLessonTranscript
            parameters:
                - in: query
                  name: language
                  schema:
                    maxLength: 35
                    minLength: 2
                    pattern: ^[a-z][a-z0-9]{1,7}(-[a-z0-9]{1,8})*$
                    type: string
                - in: path
                  name: lessonId
                  required: true
                  schema:
                    format: uuid
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/LessonTranscript'
                    description: The whole transcript of the lesson.
                    headers:
                        Cache-Control:
                            $ref: '#/components/headers/NoStore'
                        X-Request-ID:
                            $ref: '#/components/headers/RequestID'
                "400":
                    $ref: '#/components/responses/BadRequest'
                "401":
                    $ref: '#/components/responses/Unauthenticated'
                "403":
                    $ref: '#/components/responses/LearningForbidden'
                "404":
                    $ref: '#/components/responses/NotFound'
                "500":
                    $ref: '#/components/responses/InternalError'
                "503":
                    $ref: '#/components/responses/Unavailable'
