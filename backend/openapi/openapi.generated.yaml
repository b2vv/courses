    /api/v1/admin/stats/timeseries:
        get:
            description: Admin-only. Buckets one metric (signups, enrollments, orders or revenue) by day or week over a UTC window. Revenue buckets by paid time, enrollments by grant time, the rest by creation time. An unparseable or inverted range is invalid_range; a window wider than the bucket cap is range_too_wide; an unknown metric or bucket is rejected. Responses are never cached.
            operationId: getAdminStatsTimeseries
            parameters:
                - in: query
                  name: bucket
                  required: true
                  schema:
                    enum:
                        - day
                        - week
                    type: string
                - description: Inclusive RFC 3339 start; defaults to `to` minus 30 days.
                  in: query
                  name: from
                  schema:
                    format: date-time
                    type: string
                - in: query
                  name: metric
                  required: true
                  schema:
                    enum:
                        - signups
                        - enrollments
                        - orders
                        - revenue
                    type: string
                - description: Inclusive RFC 3339 end; defaults to now.
                  in: query
                  name: to
                  schema:
                    format: date-time
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/AdminStatsTimeseries'
                    description: Ordered timeseries buckets.
                    headers:
                        Cache-Control:
                            $ref: '#/components/headers/NoStore'
                        X-Request-ID:
