components:
    headers:
        NoStore:
            description: This response is never stored by caches or shared proxies.
            required: true
            schema:
                enum:
                    - no-store
                type: string
        RequestID:
            description: Server-generated correlation identifier.
            required: true
            schema:
                pattern: ^[a-f0-9]{32}$
                type: string
    responses:
        BadRequest:
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/ErrorResponse'
            description: Invalid query parameters or slug.
            headers:
                X-Request-ID:
                    $ref: '#/components/headers/RequestID'
        InternalError:
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/ErrorResponse'
            description: Unexpected error; internal details are never returned.
            headers:
                Cache-Control:
                    $ref: '#/components/headers/NoStore'
                X-Request-ID:
                    $ref: '#/components/headers/RequestID'
        NotFound:
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/ErrorResponse'
            description: Course was not found.
            headers:
                Cache-Control:
                    $ref: '#/components/headers/NoStore'
                X-Request-ID:
                    $ref: '#/components/headers/RequestID'
        Unavailable:
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/ErrorResponse'
            description: A dependency was unavailable or the bounded read timed out.
            headers:
                Cache-Control:
                    $ref: '#/components/headers/NoStore'
                X-Request-ID:
                    $ref: '#/components/headers/RequestID'
    schemas:
        Course:
            additionalProperties: false
            properties:
                createdAt:
                    format: date-time
                    type: string
                description:
                    maxLength: 20000
                    minLength: 1
                    type: string
                id:
                    format: uuid
                    type: string
                lessonCount:
                    minimum: 0
                    type: integer
                paid:
                    description: True when the course has a price; this is display metadata, not an access decision.
                    type: boolean
                price:
                    $ref: '#/components/schemas/NullablePrice'
                publishedAt:
                    format: date-time
                    nullable: true
                    type: string
                rating:
                    additionalProperties: false
                    nullable: true
                    properties:
                        average:
                            format: double
                            maximum: 5
                            minimum: 1
                            type: number
                        count:
                            minimum: 3
                            type: integer
                    required:
                        - average
                        - count
                    type: object
                slug:
                    maxLength: 120
                    minLength: 1
                    pattern: ^[a-z0-9]+(-[a-z0-9]+)*$
                    type: string
                status:
                    description: Foundation public operations only return published.
                    enum:
                        - draft
                        - published
                        - archived
                    type: string
                summary:
                    maxLength: 500
                    minLength: 1
                    type: string
                title:
                    maxLength: 200
                    minLength: 1
                    type: string
                updatedAt:
                    format: date-time
                    type: string
            required:
                - createdAt
                - description
                - id
                - lessonCount
                - paid
                - price
                - publishedAt
                - rating
                - slug
                - status
                - summary
                - title
                - updatedAt
            type: object
        CourseDetail:
            additionalProperties: false
            properties:
                createdAt:
                    format: date-time
                    type: string
                description:
                    maxLength: 20000
                    minLength: 1
                    type: string
                id:
                    format: uuid
                    type: string
                lessonCount:
                    minimum: 0
                    type: integer
                paid:
                    description: True when the course has a price; this is display metadata, not an access decision.
                    type: boolean
                price:
                    $ref: '#/components/schemas/NullablePrice'
                program:
                    items:
                        $ref: '#/components/schemas/ProgramModule'
                    maxItems: 40
                    type: array
                publishedAt:
                    format: date-time
                    type: string
                rating:
                    additionalProperties: false
                    nullable: true
                    properties:
                        average:
                            format: double
                            maximum: 5
                            minimum: 1
                            type: number
                        count:
                            minimum: 3
                            type: integer
                    required:
                        - average
                        - count
                    type: object
                slug:
                    maxLength: 120
                    minLength: 1
                    pattern: ^[a-z0-9]+(-[a-z0-9]+)*$
                    type: string
                status:
                    enum:
                        - published
                    type: string
                summary:
                    maxLength: 500
                    minLength: 1
                    type: string
                title:
                    maxLength: 200
                    minLength: 1
                    type: string
                updatedAt:
                    format: date-time
                    type: string
            required:
                - createdAt
                - description
                - id
                - lessonCount
                - paid
                - price
                - program
                - publishedAt
                - rating
                - slug
                - status
                - summary
                - title
                - updatedAt
            type: object
        CoursePage:
            additionalProperties: false
            properties:
                items:
                    items:
                        $ref: '#/components/schemas/Course'
                    maxItems: 50
                    type: array
                pagination:
                    $ref: '#/components/schemas/Pagination'
            required:
                - items
                - pagination
            type: object
        ErrorResponse:
            additionalProperties: false
            properties:
                error:
                    additionalProperties: false
                    properties:
                        code:
                            enum:
                                - invalid_lesson_document
                                - document_conflict
                                - invalid_query
                                - invalid_slug
                                - course_not_found
                                - invalid_request
                                - invalid_credentials
                                - authentication_required
                                - origin_forbidden
                                - forbidden
                                - email_taken
                                - weak_password
                                - invalid_email
                                - invalid_display_name
                                - password_unchanged
                                - token_used
                                - invalid_account_token
                                - rate_limited
                                - invalid_totp
                                - recovery_code_invalid
                                - twofactor_already_enabled
                                - twofactor_not_enabled
                                - email_not_verified
                                - course_forbidden
                                - course_purchase_required
                                - enrollment_required
                                - enrollment_blocked
                                - membership_conflict
                                - course_not_enrollable
                                - enrollment_forbidden
                                - course_already_owned
                                - checkout_already_opened
                                - grant_forbidden
                                - grant_self_forbidden
                                - admin_not_learner
                                - learner_course_forbidden
                                - grant_transition_invalid
                                - payment_event_rejected
                                - invalid_callback
                                - order_not_found
                                - playback_forbidden
                                - playback_taken_over
                                - playback_session_expired
                                - slug_taken
                                - slug_immutable
                                - invalid_owner
                                - invalid_status_transition
                                - course_not_deletable
                                - course_modified
                                - lesson_limit
                                - transcript_document_referenced
                                - transcript_document_exists
                                - transcript_segment_limit
                                - transcript_text_limit
                                - transcript_document_limit
                                - transcript_modified
                                - transcript_exists
                                - already_running
                                - cannot_target_self
                                - admin_immutable
                                - last_admin
                                - user_not_found
                                - lesson_not_found
                                - comment_not_found
                                - comment_forbidden
                                - comment_removed
                                - comment_body_invalid
                                - comment_position_invalid
                                - comment_parent_invalid
                                - comment_cursor_invalid
                                - comment_thread_full
                                - report_own_comment
                                - report_own_person
                                - report_invalid
                                - report_forbidden
                                - report_already_open
                                - review_owner_forbidden
                                - review_not_available
                                - review_purchase_required
                                - review_not_started
                                - review_moderation_forbidden
                                - report_own_review
                                - review_already_exists
                                - review_removed
                                - review_invalid
                                - review_not_found
                                - upload_in_progress
                                - unsupported_media
                                - upload_too_large
                                - video_not_found
                                - video_not_ready
                                - video_not_retryable
                                - invalid_range
                                - range_too_wide
                                - unknown_metric
                                - unknown_bucket
                                - dependency_unavailable
                                - internal_error
                                - not_found
                                - method_not_allowed
                            type: string
                        message:
                            type: string
                        requestId:
                            pattern: ^[a-f0-9]{32}$
                            type: string
                    required:
                        - code
                        - message
                        - requestId
                    type: object
            required:
                - error
            type: object
        NullablePrice:
            allOf:
                - $ref: '#/components/schemas/Price'
            nullable: true
        Pagination:
            additionalProperties: false
            properties:
                limit:
                    maximum: 50
                    minimum: 1
                    type: integer
                offset:
                    maximum: 10000
                    minimum: 0
                    type: integer
                total:
                    format: int64
                    minimum: 0
                    type: integer
            required:
                - limit
                - offset
                - total
            type: object
        Price:
            additionalProperties: false
            properties:
                currency:
                    enum:
                        - UAH
                    type: string
                minor:
                    format: int64
                    minimum: 1
                    type: integer
            required:
                - currency
                - minor
            type: object
        ProgramLesson:
            additionalProperties: false
            properties:
                title:
                    maxLength: 200
                    minLength: 1
                    type: string
            required:
                - title
            type: object
        ProgramModule:
            additionalProperties: false
            properties:
                lessons:
                    items:
                        $ref: '#/components/schemas/ProgramLesson'
                    maxItems: 120
                    type: array
                title:
                    maxLength: 200
                    minLength: 1
                    type: string
            required:
                - lessons
                - title
            type: object
        Rating:
            additionalProperties: false
            properties:
                average:
                    format: double
                    type: number
                count:
                    minimum: 3
                    type: integer
            required:
                - average
                - count
            type: object
info:
    description: Public catalog, session authentication, protected administration, learning purchases and playback-session control.
    title: Courses API
    version: 1.0.0
openapi: 3.0.3
paths:
    /api/v1/courses:
        get:
            description: Only published courses are visible. Search is PostgreSQL full-text match over title and summary (case-insensitive, word-based, space-separated terms ANDed, word order ignored); an empty search matches every published course. Query parameters must occur at most once; unknown parameters are rejected. Limit and offset accept decimal digits only. Search is trimmed before validating a maximum of 100 Unicode code points; NUL is rejected. List and total share one database snapshot.
            operationId: listPublishedCourses
            parameters:
                - in: query
                  name: limit
                  schema:
                    default: 20
                    maximum: 50
                    minimum: 1
                    type: integer
                - in: query
                  name: offset
                  schema:
                    default: 0
                    maximum: 10000
                    minimum: 0
                    type: integer
                - description: Search text, maximum 100 Unicode code points after trimming whitespace.
                  in: query
                  name: q
                  schema:
                    default: ""
                    type: string
                - description: Recent orders by publishedAt descending then ID ascending; title uses PostgreSQL C collation then ID ascending.
                  in: query
                  name: sort
                  schema:
                    default: recent
                    enum:
                        - recent
                        - title
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/CoursePage'
                    description: Published courses and pagination, including an empty items array when beyond the final page.
                    headers:
                        X-Request-ID:
                            $ref: '#/components/headers/RequestID'
                "400":
                    $ref: '#/components/responses/BadRequest'
                "500":
                    $ref: '#/components/responses/InternalError'
                "503":
                    $ref: '#/components/responses/Unavailable'
            summary: List published courses
    /api/v1/courses/{slug}:
        get:
            description: Draft, archived and unknown courses all return the same 404 response. The program contains ordered module titles and ordered lesson titles only; it exposes no ids, positions or ownership. Query parameters are not supported.
            operationId: getPublishedCourse
            parameters:
                - in: path
                  name: slug
                  required: true
                  schema:
                    maxLength: 120
                    minLength: 1
                    pattern: ^[a-z0-9]+(-[a-z0-9]+)*$
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/CourseDetail'
                    description: Published course with its ordered title-only program.
                    headers:
                        X-Request-ID:
                            $ref: '#/components/headers/RequestID'
                "400":
                    $ref: '#/components/responses/BadRequest'
                "404":
                    $ref: '#/components/responses/NotFound'
                "500":
                    $ref: '#/components/responses/InternalError'
                "503":
                    $ref: '#/components/responses/Unavailable'
            summary: Get a published course
servers:
    - url: /
