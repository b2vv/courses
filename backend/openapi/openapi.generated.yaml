    /api/v1/playback/heartbeat:
        post:
            description: Authenticated same-origin mutation. Only the current owner renews the slot and writes progress. A taken-over session and an expired session are distinct outcomes. Positions above the current video duration are accepted and clamped by the server. Bodies are limited to 8 KiB and reject duplicate keys, unknown members and trailing content.
            operationId: heartbeatPlayback
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/PlaybackHeartbeatRequest'
                required: true
            responses:
                "204":
                    description: Ownership was renewed and the progress update was processed.
                    headers:
                        Cache-Control:
                            $ref: '#/components/headers/NoStore'
                        X-Request-ID:
                            $ref: '#/components/headers/RequestID'
                "400":
                    $ref: '#/components/responses/InvalidRequest'
                "401":
                    $ref: '#/components/responses/Unauthenticated'
                "403":
