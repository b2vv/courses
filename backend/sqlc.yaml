version: '2'
sql:
  - engine: postgresql
    queries: sql/queries/courses.sql
    schema: migrations
    gen:
      go:
        package: generated
        out: internal/course/adapters/postgres/generated
        sql_package: pgx/v5
        emit_empty_slices: true
        emit_json_tags: false
        omit_unused_structs: true
