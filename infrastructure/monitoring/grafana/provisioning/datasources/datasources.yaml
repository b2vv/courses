apiVersion: 1

# Both datasources are provisioned from the repo so Grafana boots ready to read
# metrics and logs with no hand-clicking. Fixed uids let the overview dashboard
# reference them without a lookup. Both reach their service over the docker
# network only.
datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      httpMethod: POST
  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
