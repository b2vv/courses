# E2E-only: the full browser suite drives many API calls from one IP in short bursts — order-status
# polling and payment-callback vectors in purchase-wayforpay above all. Under host load the backend
# answers slower, the suite retries more, and the strict production burst (api-req.conf, burst=20)
# returns 429 on a legitimate call (seen deterministically in make e2e-local). A larger burst keeps
# the production default untouched (last-mount-wins, same mechanism as login-req.e2e.conf); the zone
# rate (10 r/s) is unchanged.
limit_req zone=api burst=200 nodelay;
