# E2E-only: the whole browser suite shares one docker IP ($binary_remote_addr),
# so a client error triggered in one spec competes with every other spec's
# ingest for the same bucket. The strict production burst would 429 a legitimate
# AC1 target POST (which the test asserts must return 204, so a swallowed 429
# would fail it). A larger burst keeps the production default untouched
# (last-mount-wins, same mechanism as api-req.e2e.conf); the zone rate is
# unchanged.
limit_req zone=clientlog burst=200 nodelay;
