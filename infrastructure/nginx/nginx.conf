worker_processes auto;
pid /tmp/nginx.pid;
# Nginx's fixed error format includes request URI and Referer, including secrets.
# Keep safe structured access/status logs; never persist the raw HTTP error sink.
error_log /dev/null;
events { worker_connections 1024; }
http {
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  log_format safe escape=json '{"service":"nginx","requestId":"$request_id","method":"$request_method","status":$status,"duration":$request_time}';
  access_log /dev/stdout safe;
  server_tokens off;
  sendfile on;
  keepalive_timeout 30;
  client_max_body_size 1m;
  limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
  # SSR reaches the API over the internal network, so a request to the page
  # routes never passes the api zone. Without its own budget the catalog and its
  # substring search are an unmetered path into PostgreSQL.
  limit_req_zone $binary_remote_addr zone=web:10m rate=50r/s;
  # One login attempt costs an Argon2id verification at 64 MiB, and the same
  # price is paid for accounts that do not exist, so the budget here is a
  # human login rate rather than an API rate.
  limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
  limit_req_zone $binary_remote_addr zone=upload:10m rate=30r/s;
  limit_req_zone $binary_remote_addr zone=media:10m rate=120r/s;
  limit_req_status 429;
  proxy_connect_timeout 2s;
  proxy_read_timeout 15s;
  proxy_send_timeout 15s;
  # Resolve service replacements instead of retaining an old Compose container IP.
  resolver 127.0.0.11 valid=5s ipv6=off;
  map $http_upgrade $connection_upgrade { default upgrade; '' close; }
  map $uri $playback_id {
    default "";
    "~^/media/p/(?<p>[0-9a-f]{32})/hls/" $p;
  }
  map $uri $media_video {
    default "";
    "~^/media/p/[0-9a-f]{32}/hls/(?<v>[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})/" $v;
  }
  # The image id is the file name up to the extension; it becomes X-Image-Id for the authorize
  # subrequest and must be a bare UUID (the authorize casts it to uuid). An empty value => 403.
  map $uri $image_id {
    default "";
    "~^/media/i/(?<i>[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})\.(jpg|png|webp)$" $i;
  }
  server {
    listen 8080;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    location = /healthz { access_log off; default_type application/json; return 200 '{"status":"ok"}'; }
    location = /api {
      add_header X-Content-Type-Options nosniff always;
      add_header Referrer-Policy strict-origin-when-cross-origin always;
      add_header X-Frame-Options DENY always;
      add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
      return 404;
    }
    location = /media {
      add_header X-Content-Type-Options nosniff always;
      add_header Referrer-Policy strict-origin-when-cross-origin always;
      add_header X-Frame-Options DENY always;
      add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
      return 403;
    }
    location ^~ /media/p/ {
      set $pb $playback_id;
      set $vid $media_video;
      if ($pb = "") { return 403; }
      if ($vid = "") { return 403; }

      auth_request /_media_auth;
      error_page 401 403 = @denied;
      error_page 500 502 504 = @unavailable;

      limit_req zone=media burst=240 nodelay;
      add_header X-Content-Type-Options nosniff always;
      add_header Referrer-Policy strict-origin-when-cross-origin always;
      add_header X-Frame-Options DENY always;
      add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
      add_header Cache-Control "private, no-store" always;

      rewrite "^/media/p/[0-9a-f]{32}/(.*)$" /$1 break;
      root /media;
    }
    location @denied {
      add_header X-Content-Type-Options nosniff always;
      add_header Referrer-Policy strict-origin-when-cross-origin always;
      add_header X-Frame-Options DENY always;
      add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
      return 403;
    }
    location @unavailable {
      add_header X-Content-Type-Options nosniff always;
      add_header Referrer-Policy strict-origin-when-cross-origin always;
      add_header X-Frame-Options DENY always;
      add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
      add_header Retry-After 1 always;
      return 503;
    }
    location ^~ /media/i/ {
      set $img $image_id;
      if ($img = "") { return 403; }

      auth_request /_image_auth;
      error_page 401 403 = @denied;
      error_page 500 502 504 = @unavailable;

      limit_req zone=media burst=240 nodelay;
      add_header X-Content-Type-Options nosniff always;
      add_header Referrer-Policy strict-origin-when-cross-origin always;
      add_header X-Frame-Options DENY always;
      add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
      add_header Cache-Control "private, no-store" always;

      # Strip the public prefix so the file resolves under /media; the extension gives nginx the
      # Content-Type from mime.types (required under nosniff). Flat tree: /media/i/<uuid>.<ext>.
      rewrite "^/media/i/(.*)$" /i/$1 break;
      root /media;
    }
    location ^~ /media/ {
      add_header X-Content-Type-Options nosniff always;
      add_header Referrer-Policy strict-origin-when-cross-origin always;
      add_header X-Frame-Options DENY always;
      add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
      return 403;
    }
    location = /_media_auth {
      internal;
      set $api http://api:8080;
      proxy_pass $api/internal/playback/authorize;
      proxy_pass_request_body off;
      proxy_set_header Content-Length "";
      proxy_set_header X-Playback-Id $pb;
      proxy_set_header X-Video-Id $vid;
      proxy_connect_timeout 2s;
      proxy_read_timeout 5s;
    }
    location = /_image_auth {
      internal;
      set $api http://api:8080;
      proxy_pass $api/internal/image/authorize;
      proxy_pass_request_body off;
      proxy_set_header Content-Length "";
      proxy_set_header X-Image-Id $img;
      proxy_connect_timeout 2s;
      proxy_read_timeout 5s;
    }
    location = /metrics { return 404; }
    location = /readyz { return 404; }
    location ^~ /uploads/ {
      limit_req zone=upload burst=60 nodelay;
      client_max_body_size 16m;
      proxy_request_buffering off;
      proxy_read_timeout 120s;
      proxy_send_timeout 120s;
      set $upload http://upload:8082;
      proxy_pass $upload;
      proxy_set_header Host $host;
      proxy_set_header X-Request-ID $request_id;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header traceparent "";
      proxy_set_header tracestate "";
    }
    location = /api/v1/auth/login {
      # Strict by default (login-req.conf, burst 5); docker-compose.e2e mounts a larger-burst
      # variant over this path so the auth e2e's many logins are not anti-brute-force 429'd.
      include /etc/nginx/login-req.conf;
      set $login http://api:8080;
      proxy_pass $login;
      proxy_set_header Host $host;
      proxy_set_header X-Request-ID $request_id;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header traceparent "";
      proxy_set_header tracestate "";
    }
    location ^~ /api/ {
      # The image upload carries a multipart body up to ~5 MiB, which the /api/ ceiling of 1m below
      # would reject. A nested regex location raises the limit for this one path only; 6m sits above
      # the Go handler's 5 MiB + envelope, so an over-limit upload gets the app's clean 413
      # image_too_large rather than nginx's bare one. A nested location does not inherit proxy_pass,
      # so the proxy block is repeated; the four security headers are repeated per this file's
      # convention (add_header is replaced, not merged, by a location that sets any).
      location ~ "^/api/v1/admin/lessons/[0-9a-f-]{36}/images$" {
        include /etc/nginx/api-req.conf;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options DENY always;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
        client_max_body_size 6m;
        set $api http://api:8080;
        proxy_pass $api;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header traceparent "";
        proxy_set_header tracestate "";
      }
      # Strict by default (api-req.conf, burst 20); docker-compose.e2e mounts a larger-burst
      # variant over this path so the full browser suite's API bursts are not 429'd under load.
      include /etc/nginx/api-req.conf;
      add_header X-Content-Type-Options nosniff always;
      add_header Referrer-Policy strict-origin-when-cross-origin always;
      add_header X-Frame-Options DENY always;
      add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;

      # Compression lives here and not in `http{}` on purpose. The page routes below run with
      # `proxy_buffering off` so SSR streams, and gzip in `http{}` would buffer that stream to
      # compress it; the media locations would get it too, on bytes that are already compressed.
      #
      # Three defaults make "just switch it on" wrong, so each is named rather than assumed:
      # `gzip_proxied` defaults to `off` and everything under /api/ is proxied, so without it
      # nothing here is ever compressed; `gzip_types` defaults to `text/html` alone, so JSON and
      # WebVTT have to be listed; `gzip_vary` defaults to `off`, and a shared cache that stores
      # one encoding without `Vary: Accept-Encoding` serves gzip to a client that did not ask.
      gzip on;
      gzip_proxied any;
      gzip_vary on;
      gzip_types application/json text/vtt;
      # Below roughly one MSS the compressed reply plus its header costs more than it saves.
      gzip_min_length 1024;

      # Declared, not inherited. The value equals the `http{}` default, so behaviour is
      # unchanged - what changes is that /api/ no longer depends on a number set three screens
      # away. The transcript write path needs a larger ceiling derived from its own byte
      # constant, and that number belongs to the slice that introduces the constant: it cannot
      # be chosen here, because a request ceiling is about requests and nothing shipped writes
      # a transcript yet. Today's largest write is the admin course tree, bounded at 512 KiB by
      # `maximumAdminWriteBody` (admin_handler.go:19), well inside this.
      client_max_body_size 1m;

      set $api http://api:8080;
      proxy_pass $api;
      proxy_set_header Host $host;
      proxy_set_header X-Request-ID $request_id;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header traceparent "";
      proxy_set_header tracestate "";
    }
    location / {
      limit_req zone=web burst=100 nodelay;
      set $frontend http://frontend:3000;
      proxy_pass $frontend;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Request-ID $request_id;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header traceparent "";
      proxy_set_header tracestate "";
      proxy_buffering off;
    }
  }
}
