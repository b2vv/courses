worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  log_format safe escape=json '{"service":"nginx","requestId":"$request_id","method":"$request_method","status":$status,"duration":$request_time}';
  access_log /dev/stdout safe;
  server_tokens off;
  sendfile on;
  keepalive_timeout 30;
  client_max_body_size 1m;
  limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
  limit_req_status 429;
  proxy_connect_timeout 2s;
  proxy_read_timeout 15s;
  proxy_send_timeout 15s;
  # Resolve service replacements instead of retaining an old Compose container IP.
  resolver 127.0.0.11 valid=5s ipv6=off;
  map $http_upgrade $connection_upgrade { default upgrade; '' close; }
  server {
    listen 8080;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    location = /healthz { access_log off; default_type application/json; return 200 '{"status":"ok"}'; }
    location = /api { return 404; }
    location = /media { return 403; }
    location ^~ /media/ { return 403; }
    location = /metrics { return 404; }
    location = /readyz { return 404; }
    location ^~ /api/ {
      limit_req zone=api burst=20 nodelay;
      set $api http://api:8080;
      proxy_pass $api;
      proxy_set_header Host $host;
      proxy_set_header X-Request-ID $request_id;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $remote_addr;
    }
    location / {
      set $frontend http://frontend:3000;
      proxy_pass $frontend;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Request-ID $request_id;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_buffering off;
    }
  }
}
